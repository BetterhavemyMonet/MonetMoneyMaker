<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HASH RACER — MONET Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script src="/wallet.js"></script>
<script src="/lobby.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body.game-page{background:#000;overflow:hidden;touch-action:none}
body.game-page::before{display:none}
.gw{display:flex;flex-direction:column;height:100vh}
#wbar{text-align:center;padding:3px 10px;background:#000;border-bottom:1px solid #001133;font-size:11px;flex-shrink:0}
.arena{flex:1;min-height:0;position:relative;background:#000}
#gc{display:block;width:100%;height:100%}
.ctrl{flex-shrink:0;background:rgba(0,2,10,.95);border-top:1px solid #001133;padding:5px 8px}
.cr{display:flex;justify-content:space-between;align-items:center;gap:5px}
.cb{height:54px;border-radius:10px;border:none;font-family:'Orbitron',sans-serif;font-weight:900;cursor:pointer;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;font-size:10px;line-height:1.3}
.cb:active{transform:translateY(3px)!important;box-shadow:0 1px 0!important}
.sl{flex:1;background:linear-gradient(135deg,#1a0022,#0d0011);color:#cc44ff;border:1px solid #440066;box-shadow:0 4px 0 #000}
.sr{flex:1;background:linear-gradient(135deg,#1a0022,#0d0011);color:#cc44ff;border:1px solid #440066;box-shadow:0 4px 0 #000}
.thr{flex:1.3;background:linear-gradient(135deg,#002211,#001108);color:#00ff9d;border:1px solid #006633;box-shadow:0 4px 0 #000;font-size:11px}
.trb{flex:1.3;background:linear-gradient(135deg,#220011,#110008);color:#ff2244;border:1px solid #660022;box-shadow:0 4px 0 #000;font-size:11px}
.home{font-size:18px;color:#333;text-decoration:none;padding:0 4px;align-self:center}
</style>
</head>
<body class="game-page">
<div class="wallet-bar" id="wbar"></div>
<div class="gw">
  <div class="arena"><canvas id="gc"></canvas></div>
  <div class="ctrl">
    <div class="cr">
      <button class="cb sl" ontouchstart="steerUp();event.preventDefault()"   onmousedown="steerUp()">◀<br>LEAN<br>LEFT</button>
      <button class="cb thr" ontouchstart="keys.throttle=true;event.preventDefault()" ontouchend="keys.throttle=false" onmousedown="keys.throttle=true" onmouseup="keys.throttle=false" onmouseleave="keys.throttle=false">⚡<br>GAS</button>
      <button class="cb trb" ontouchstart="keys.turbo=true;event.preventDefault()" ontouchend="keys.turbo=false" onmousedown="keys.turbo=true" onmouseup="keys.turbo=false" onmouseleave="keys.turbo=false">🔥<br>TURBO</button>
      <a class="home" href="arcade.html">⌂</a>
      <button class="cb sr" ontouchstart="steerDown();event.preventDefault()" onmousedown="steerDown()">▶<br>LEAN<br>RIGHT</button>
    </div>
  </div>
</div>
<script>
const C = document.getElementById('gc'), X = C.getContext('2d');
let W, H;

function resize() {
  const p = C.parentElement;
  W = p.clientWidth; H = p.clientHeight;
  C.width = W; C.height = H;
}
window.addEventListener('resize', () => { resize(); if (phase === 'play') initLanes(); });

// ── Lane system ───────────────────────────────────────────────────────────────
const LANE_COUNT = 3;
let LANE_YS = [];   // pixel Y centres of each lane, computed after resize
const BIKE_X = 110; // player X on screen

function initLanes() {
  const roadTop = H * 0.30;
  const roadH   = H - roadTop;
  LANE_YS = [
    roadTop + roadH * 0.18,
    roadTop + roadH * 0.50,
    roadTop + roadH * 0.82,
  ];
}

// ── State ─────────────────────────────────────────────────────────────────────
const keys = { throttle: false, turbo: false };

let ply, scrollX, speed, heat, overheated;
let lives, distance, score, lapBonus;
let curLane, targetLane, laneY, laneVY;
let oilSlip, oilTimer;          // oil slick effect
let airH, airVY;                // bump launch
let steerCooldown;              // frames between lane changes
let lean;                       // visual lean angle
let phase, rafId, lastT = 0;
let floatTexts, stars;
let completedLaps, lapLen, lapStartX, lapTimerMs;
let obstacles;                  // { wx, lane, type, hit }
let nextObsWX;                  // world X of next obstacle to spawn
let sessionActive = false;

const GRAV         = 0.32;
const NORMAL_MAX   = 5.8;
const TURBO_MAX    = 10.0;
const ACCEL        = 0.09;
const HEAT_RATE    = 1.6;
const COOL_RATE    = 0.9;
const OHEAT_COOL   = 3.0;
const LAP_LEN      = 9000;      // world units per lap
const OBS_TYPES    = ['rival','rival','oil','bump','pothole'];

function baseDiff() { return 1 + completedLaps * 0.22; }
function topSpeed()  { return Math.min(TURBO_MAX, NORMAL_MAX + completedLaps * 0.35); }

function initStars() {
  stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.30, r: 0.4 + Math.random() * 1.3
  }));
}

function initGame() {
  scrollX = 0; speed = 2.8; heat = 0; overheated = false;
  lives = 3; distance = 0; score = 0; lapBonus = 0;
  curLane = 1; targetLane = 1;
  laneY = LANE_YS[1]; laneVY = 0;
  oilSlip = false; oilTimer = 0;
  airH = 0; airVY = 0;
  steerCooldown = 0; lean = 0;
  completedLaps = 0; lapStartX = 0; lapTimerMs = 0;
  floatTexts = [];
  obstacles = [];
  nextObsWX = 800;
}

function doSteer(dir) {          // dir: -1 (up lane) or +1 (down lane)
  if (phase !== 'play' || oilSlip || steerCooldown > 0 || overheated) return;
  const next = curLane + dir;
  if (next < 0 || next >= LANE_COUNT) return;
  targetLane = next;
  curLane = next;
  lean = dir * 0.38;
  steerCooldown = 320;          // ms
}
function steerUp()   { doSteer(-1); }
function steerDown() { doSteer(+1); }

// ── Obstacle generation ───────────────────────────────────────────────────────
function spawnObs() {
  const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
  const lane = Math.floor(Math.random() * LANE_COUNT);
  const diff = baseDiff();
  const gap  = Math.max(300, (550 - completedLaps * 30)) + Math.random() * 350;
  obstacles.push({ wx: nextObsWX, lane, type, hit: false });
  nextObsWX += gap;
}

// ── Crash / effects ───────────────────────────────────────────────────────────
function doCrash() {
  if (lives <= 0) return;
  lives--;
  floatTexts.push({ x: BIKE_X, y: -40, txt: '💥 WIPEOUT!', col: '#ff4444', life: 60, vy: -0.8 });
  speed = 1.2; oilSlip = false; oilTimer = 0; airH = 0; airVY = 0;
  if (lives <= 0) setTimeout(endGame, 800);
}

function doOilSlip() {
  if (oilSlip) return;
  oilSlip = true; oilTimer = 1400;
  floatTexts.push({ x: BIKE_X, y: -30, txt: '🛢 OIL SLICK!', col: '#aa44ff', life: 55, vy: -0.6 });
  lean = (Math.random() > 0.5 ? 1 : -1) * 0.55;
}

function doBump() {
  if (airH > 0) return;
  airH = 1; airVY = speed * 0.6;
  floatTexts.push({ x: BIKE_X, y: -30, txt: '⬆ SPEED BUMP!', col: '#ffcc00', life: 50, vy: -0.7 });
  score += 50;
  floatTexts.push({ x: BIKE_X + 30, y: -30, txt: '+50', col: '#ffd700', life: 40, vy: -0.5 });
}

// ── Lap completion ────────────────────────────────────────────────────────────
function completeLap() {
  completedLaps++;
  const timeBonus = Math.max(0, Math.round(8000 - lapTimerMs * 0.5));
  lapBonus += timeBonus;
  score += timeBonus;
  lapStartX = scrollX;
  lapTimerMs = 0;
  floatTexts.push({ x: W / 2, y: 40, txt: 'LAP ' + completedLaps + ' COMPLETE! +' + timeBonus, col: '#ffd700', life: 90, vy: -0.4 });
  // Clear obstacles ahead and respace
  obstacles = obstacles.filter(o => !o.hit && o.wx > scrollX + W);
  nextObsWX = scrollX + W + 600;
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(dt) {
  if (phase !== 'play') return;
  const s = dt / 16;

  lapTimerMs += dt;
  steerCooldown = Math.max(0, steerCooldown - dt);

  // Oil slip decay
  if (oilSlip) {
    oilTimer -= dt;
    lean = lean * (1 - 0.025 * s);
    if (oilTimer <= 0) { oilSlip = false; oilTimer = 0; lean = 0; }
  } else {
    lean = lean * (1 - 0.08 * s);
  }

  // Overheat
  if (overheated) {
    heat = Math.max(0, heat - OHEAT_COOL * s);
    speed = Math.max(0.5, speed - 0.07 * s);
    if (heat <= 0) { overheated = false; speed = 0.8; }
  } else {
    // Speed control — throttle = normal gas, turbo = overheat risk
    const maxSpd = topSpeed();
    if (keys.turbo && !overheated) {
      speed = Math.min(TURBO_MAX, speed + ACCEL * 1.8 * s);
      heat  = Math.min(100, heat + HEAT_RATE * s);
      if (heat >= 100) { overheated = true; speed = 0; }
    } else if (keys.throttle) {
      speed = Math.min(maxSpd, speed + ACCEL * s);
      heat  = Math.max(0, heat - COOL_RATE * 0.5 * s);
    } else {
      // Coast — decelerate gently
      speed = Math.max(0.8, speed - ACCEL * 0.4 * s);
      heat  = Math.max(0, heat - COOL_RATE * s);
    }
  }

  scrollX += speed * s * baseDiff() * 0.95;
  distance = Math.round(scrollX / 40);

  // Score: distance component (continuously updates)
  score = Math.floor(scrollX / 30) + lapBonus;

  // Airborne (from bump)
  if (airH > 0) {
    airVY -= GRAV * s;
    airH  += airVY * s;
    if (airH <= 0) { airH = 0; airVY = 0; }
  }

  // Lane Y interpolation (smooth)
  const tgtY = LANE_YS[targetLane];
  laneY += (tgtY - laneY) * Math.min(1, 0.12 * s);

  // Generate obstacles
  while (nextObsWX < scrollX + W * 3.5) spawnObs();

  // Lap tracking
  if (scrollX - lapStartX >= LAP_LEN) completeLap();

  // Check obstacle collisions
  for (const o of obstacles) {
    if (o.hit) continue;
    const osx = o.wx - scrollX;  // screen X
    if (osx < -60 || osx > W + 60) continue;
    if (Math.abs(osx - BIKE_X) < 40 && o.lane === curLane && airH < 8) {
      o.hit = true;
      if      (o.type === 'rival')   doCrash();
      else if (o.type === 'oil')     doOilSlip();
      else if (o.type === 'bump')    doBump();
      else if (o.type === 'pothole') doCrash();
    }
  }

  // Trim old obstacles
  if (obstacles.length > 120) obstacles = obstacles.filter(o => o.wx > scrollX - W);

  // Float texts
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.y += f.vy; f.life--;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBG() {
  const roadTop = H * 0.30;
  const sky = X.createLinearGradient(0, 0, 0, roadTop);
  sky.addColorStop(0, '#000008'); sky.addColorStop(1, '#070520');
  X.fillStyle = sky; X.fillRect(0, 0, W, roadTop);

  // Stars
  X.fillStyle = '#ffffff28';
  stars.forEach(s => { X.beginPath(); X.arc(s.x, s.y, s.r, 0, Math.PI * 2); X.fill(); });

  // Moon
  X.fillStyle = '#fffde0'; X.shadowBlur = 24; X.shadowColor = '#fffde066';
  X.beginPath(); X.arc(W * 0.78, H * 0.08, 16, 0, Math.PI * 2); X.fill();
  X.shadowBlur = 0;
  X.fillStyle = '#050514'; X.beginPath(); X.arc(W * 0.78 + 5, H * 0.08 - 2, 12, 0, Math.PI * 2); X.fill();

  // Mountains
  X.fillStyle = '#060614';
  X.beginPath(); X.moveTo(0, roadTop);
  const pts = [[0,0.82],[.07,.66],[.15,.75],[.24,.58],[.33,.7],[.43,.55],[.53,.68],[.63,.52],[.73,.65],[.83,.57],[.93,.7],[1,.78]];
  pts.forEach(([px, py]) => X.lineTo(W * px, roadTop * py));
  X.lineTo(W, roadTop); X.closePath(); X.fill();

  // Road background (3-lane area)
  const rg = X.createLinearGradient(0, roadTop, 0, H);
  rg.addColorStop(0, '#151524'); rg.addColorStop(0.3, '#0e0e1c'); rg.addColorStop(1, '#070710');
  X.fillStyle = rg; X.fillRect(0, roadTop, W, H - roadTop);

  // Road-edge divider (horizon line)
  X.strokeStyle = '#ff224444'; X.lineWidth = 2;
  X.beginPath(); X.moveTo(0, roadTop); X.lineTo(W, roadTop); X.stroke();

  // Lane divider lines (dashed)
  X.strokeStyle = '#ffffff14'; X.lineWidth = 2;
  X.setLineDash([24, 18]);
  const laneH = (H - roadTop) / LANE_COUNT;
  for (let l = 1; l < LANE_COUNT; l++) {
    const ly = roadTop + laneH * l;
    X.beginPath(); X.moveTo(0, ly); X.lineTo(W, ly); X.stroke();
  }
  X.setLineDash([]);

  // Road edge lines (bottom)
  X.strokeStyle = '#ff2244aa'; X.lineWidth = 3;
  X.beginPath(); X.moveTo(0, H - 2); X.lineTo(W, H - 2); X.stroke();
}

function drawObstacles() {
  const roadTop = H * 0.30;
  const laneH   = (H - roadTop) / LANE_COUNT;

  for (const o of obstacles) {
    if (o.hit) continue;
    const sx = o.wx - scrollX;
    if (sx < -80 || sx > W + 80) continue;
    const cy = LANE_YS[o.lane];

    if (o.type === 'rival') {
      drawRivalBike(sx, cy);
    } else if (o.type === 'oil') {
      // Oil puddle
      X.fillStyle = '#000000cc';
      X.shadowBlur = 8; X.shadowColor = '#660088';
      X.beginPath(); X.ellipse(sx, cy + laneH * 0.14, 36, 10, 0, 0, Math.PI * 2); X.fill();
      X.shadowBlur = 0;
      X.fillStyle = '#aa44ff44';
      X.beginPath(); X.ellipse(sx, cy + laneH * 0.1, 28, 7, 0, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#cc66ff88'; X.font = 'bold 9px Orbitron,sans-serif'; X.textAlign = 'center';
      X.fillText('OIL', sx, cy - laneH * 0.05);
    } else if (o.type === 'bump') {
      // Speed bump ridge
      X.fillStyle = '#eecc00';
      X.shadowBlur = 6; X.shadowColor = '#ffcc0066';
      X.beginPath(); X.ellipse(sx, cy + laneH * 0.16, 22, 6, 0, 0, Math.PI * 2); X.fill();
      X.fillStyle = '#000'; X.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        X.strokeStyle = '#000';
        X.beginPath(); X.moveTo(sx + i * 10, cy + laneH * 0.11); X.lineTo(sx + i * 10, cy + laneH * 0.22); X.stroke();
      }
      X.shadowBlur = 0;
      X.fillStyle = '#ffd70088'; X.font = 'bold 8px Orbitron,sans-serif'; X.textAlign = 'center';
      X.fillText('BUMP', sx, cy - laneH * 0.05);
    } else if (o.type === 'pothole') {
      // Dark pothole
      X.fillStyle = '#000';
      X.shadowBlur = 10; X.shadowColor = '#ff224444';
      X.beginPath(); X.ellipse(sx, cy + laneH * 0.14, 28, 12, 0, 0, Math.PI * 2); X.fill();
      X.shadowBlur = 0;
      X.strokeStyle = '#33111122'; X.lineWidth = 2;
      X.beginPath(); X.ellipse(sx, cy + laneH * 0.12, 22, 8, 0, 0, Math.PI * 2); X.stroke();
      X.fillStyle = '#ff224466'; X.font = 'bold 8px Orbitron,sans-serif'; X.textAlign = 'center';
      X.fillText('HOLE', sx, cy - laneH * 0.05);
    }
  }
}

function drawRivalBike(x, y) {
  X.save(); X.translate(x, y);
  X.fillStyle = '#441100'; X.strokeStyle = '#663300'; X.lineWidth = 2;
  X.beginPath(); X.arc(-12, 4, 9, 0, Math.PI * 2); X.fill(); X.stroke();
  X.beginPath(); X.arc(12, 4, 9, 0, Math.PI * 2); X.fill(); X.stroke();
  X.strokeStyle = '#774400'; X.lineWidth = 4; X.lineCap = 'round';
  X.beginPath(); X.moveTo(-12, 2); X.lineTo(12, 2); X.stroke();
  X.beginPath(); X.moveTo(-5, -12); X.lineTo(-12, 2); X.stroke();
  X.beginPath(); X.moveTo(6, -10); X.lineTo(12, 2); X.stroke();
  X.fillStyle = '#552200';
  X.beginPath(); X.ellipse(-2, -17, 5, 8, 0, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#663311'; X.beginPath(); X.arc(-2, -25, 6, 0, Math.PI * 2); X.fill();
  X.restore();
}

function drawPlayerBike() {
  const bx = BIKE_X;
  const by = laneY - airH * 1.8;
  const roadTop = H * 0.30;

  // Shadow
  X.fillStyle = 'rgba(0,0,0,0.3)';
  X.beginPath(); X.ellipse(bx, laneY + 6, 20 + airH * 0.3, 5, 0, 0, Math.PI * 2); X.fill();

  X.save(); X.translate(bx, by); X.rotate(lean);

  const WR = 11;
  const wrot = (scrollX / 14) % (Math.PI * 2);

  // Rear wheel
  X.fillStyle = '#1a1a1a'; X.strokeStyle = '#3a3a3a'; X.lineWidth = 2;
  X.beginPath(); X.arc(-15, 3, WR, 0, Math.PI * 2); X.fill(); X.stroke();
  X.strokeStyle = '#4a4a4a'; X.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const a = wrot + i * Math.PI / 2;
    X.beginPath(); X.moveTo(-15, 3); X.lineTo(-15 + Math.cos(a) * WR, 3 + Math.sin(a) * WR); X.stroke();
  }

  // Front wheel
  X.fillStyle = '#1a1a1a'; X.strokeStyle = '#3a3a3a'; X.lineWidth = 2;
  X.beginPath(); X.arc(15, 3, WR, 0, Math.PI * 2); X.fill(); X.stroke();
  X.strokeStyle = '#4a4a4a'; X.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const a = wrot + i * Math.PI / 2;
    X.beginPath(); X.moveTo(15, 3); X.lineTo(15 + Math.cos(a) * WR, 3 + Math.sin(a) * WR); X.stroke();
  }

  // Frame
  X.strokeStyle = '#dd1133'; X.lineWidth = 4; X.lineCap = 'round';
  X.beginPath(); X.moveTo(-15, 0); X.lineTo(-4, -14); X.lineTo(10, -12); X.lineTo(15, 0); X.stroke();
  X.fillStyle = '#aa0e22'; X.fillRect(-6, -17, 13, 9);
  X.fillStyle = '#dd2244'; X.fillRect(-5, -16, 8, 4);
  // Fork
  X.strokeStyle = '#888'; X.lineWidth = 2;
  X.beginPath(); X.moveTo(10, -12); X.lineTo(15, 3); X.stroke();
  // Exhaust
  X.strokeStyle = '#777'; X.lineWidth = 3;
  X.beginPath(); X.moveTo(-11, -6); X.lineTo(-22, 4); X.stroke();
  X.fillStyle = '#555'; X.beginPath(); X.arc(-22, 4, 4, 0, Math.PI * 2); X.fill();

  // Rider
  X.fillStyle = '#1144cc';
  X.beginPath(); X.ellipse(-2, -24, 6, 10, lean * -0.3, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#ee3300'; X.beginPath(); X.arc(-2, -34, 7, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#ffcc00'; X.fillRect(-5, -37, 9, 4);

  // Speed streaks
  if (speed > 5 && !overheated) {
    const a = Math.min(0.65, (speed - 5) / 5);
    X.strokeStyle = `rgba(255,34,68,${a})`;
    X.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const ly = -8 + i * 7;
      X.beginPath(); X.moveTo(-19, ly); X.lineTo(-26 - Math.random() * 9, ly); X.stroke();
    }
  }

  // Turbo flame
  if (keys.turbo && !overheated && speed > 3) {
    X.fillStyle = `rgba(255,${50 + Math.random() * 90 | 0},0,.9)`;
    X.beginPath(); X.moveTo(-19, -3); X.lineTo(-27 - Math.random() * 8, 0); X.lineTo(-19, 3); X.closePath(); X.fill();
    X.fillStyle = `rgba(255,200,0,.6)`;
    X.beginPath(); X.moveTo(-19, -1); X.lineTo(-23 - Math.random() * 4, 0); X.lineTo(-19, 2); X.closePath(); X.fill();
  }

  // Oil slip wobble glow
  if (oilSlip) {
    X.shadowBlur = 14; X.shadowColor = '#aa44ff';
    X.strokeStyle = '#aa44ff44'; X.lineWidth = 1;
    X.strokeRect(-18, -38, 36, 44); X.shadowBlur = 0;
  }

  // Airborne glow
  if (airH > 6) {
    X.shadowBlur = 12; X.shadowColor = '#ffcc0044';
    X.strokeStyle = '#ffcc0022'; X.lineWidth = 1;
    X.strokeRect(-18, -38, 36, 44); X.shadowBlur = 0;
  }
  X.restore();
}

function drawHUD() {
  // Title
  X.fillStyle = '#ff2244'; X.font = 'bold 11px Orbitron,sans-serif';
  X.textAlign = 'center'; X.shadowBlur = 8; X.shadowColor = '#ff224466';
  X.fillText('HASH RACER', W / 2, 14); X.shadowBlur = 0;

  // Score
  X.fillStyle = '#ffd700'; X.font = 'bold 13px Orbitron,sans-serif'; X.textAlign = 'right';
  X.shadowBlur = 6; X.shadowColor = '#ffd70066';
  X.fillText(score.toLocaleString(), W - 10, 14); X.shadowBlur = 0;

  // Distance
  X.fillStyle = '#ffffff55'; X.font = 'bold 8px Orbitron,sans-serif'; X.textAlign = 'right';
  X.fillText(distance + 'm', W - 10, 26);

  // Lives
  X.textAlign = 'left'; X.font = 'bold 11px Orbitron,sans-serif';
  for (let i = 0; i < lives; i++) { X.fillStyle = '#ff4444'; X.fillText('♥', 6 + i * 16, 14); }

  // Lap indicator
  X.fillStyle = '#ffffff44'; X.font = 'bold 8px Orbitron,sans-serif'; X.textAlign = 'left';
  const lapPct = Math.min(1, (scrollX - lapStartX) / LAP_LEN);
  X.fillText('LAP ' + (completedLaps + 1) + '  ' + Math.round(lapPct * 100) + '%', 6, 26);

  // Speed bar
  const bx = 6, by = 32, bw = 78, bh = 6;
  X.fillStyle = '#111'; X.fillRect(bx, by, bw, bh);
  X.fillStyle = speed > NORMAL_MAX ? '#ff2244' : '#00ff9d';
  X.fillRect(bx, by, bw * (speed / TURBO_MAX), bh);
  X.strokeStyle = '#222'; X.lineWidth = 1; X.strokeRect(bx, by, bw, bh);
  X.fillStyle = '#666'; X.font = 'bold 6px Orbitron,sans-serif'; X.textAlign = 'left';
  X.fillText('SPEED', bx, by + bh + 8);

  // Heat bar
  const hx = 6, hy = 48, hw = 78, hh = 6;
  X.fillStyle = '#111'; X.fillRect(hx, hy, hw, hh);
  const hc = heat > 75 ? '#ff1100' : heat > 45 ? '#ff8800' : '#ffcc00';
  if (!overheated) {
    X.fillStyle = hc; X.fillRect(hx, hy, hw * (heat / 100), hh);
  } else if (Math.floor(Date.now() / 170) % 2) {
    X.fillStyle = '#ff0000'; X.fillRect(hx, hy, hw, hh);
  }
  X.strokeStyle = '#222'; X.strokeRect(hx, hy, hw, hh);
  X.fillStyle = overheated ? '#ff4444' : '#666'; X.font = 'bold 6px Orbitron,sans-serif';
  X.fillText(overheated ? '🛑 STALLED' : 'HASH TEMP', hx, hy + hh + 8);

  // Oil slip indicator
  if (oilSlip) {
    X.fillStyle = '#cc44ff'; X.font = 'bold 9px Orbitron,sans-serif'; X.textAlign = 'center';
    X.shadowBlur = 8; X.shadowColor = '#cc44ff';
    if (Math.floor(Date.now() / 200) % 2)
      X.fillText('⚠ OIL SLICK ⚠', W / 2, H * 0.28);
    X.shadowBlur = 0;
  }

  // Float texts
  floatTexts.forEach(f => {
    X.save(); X.globalAlpha = Math.max(0, f.life / 60);
    X.fillStyle = f.col; X.font = 'bold 11px Orbitron,sans-serif';
    X.textAlign = 'center'; X.shadowBlur = 8; X.shadowColor = f.col;
    X.fillText(f.txt, f.x, H * 0.38 + f.y); X.restore();
  });
}

function drawLaneIndicator() {
  // Small lane position dots on right edge
  const roadTop = H * 0.30;
  const laneH   = (H - roadTop) / LANE_COUNT;
  const dotX = W - 14;
  for (let l = 0; l < LANE_COUNT; l++) {
    const ly = LANE_YS[l];
    X.fillStyle = l === curLane ? '#ff2244' : '#333';
    X.shadowBlur = l === curLane ? 8 : 0; X.shadowColor = '#ff2244';
    X.beginPath(); X.arc(dotX, ly, l === curLane ? 6 : 4, 0, Math.PI * 2); X.fill();
    X.shadowBlur = 0;
  }
}

function drawIdle() {
  X.fillStyle = 'rgba(0,2,10,.82)'; X.fillRect(0, 0, W, H);
  X.fillStyle = '#ff2244'; X.font = `bold ${Math.min(24, W * 0.07)}px Orbitron,sans-serif`;
  X.textAlign = 'center'; X.shadowBlur = 28; X.shadowColor = '#ff2244';
  X.fillText('HASH RACER', W / 2, H / 2 - 16);
  X.shadowBlur = 0; X.fillStyle = '#ffffff55'; X.font = `bold ${Math.min(9, W * 0.026)}px Orbitron,sans-serif`;
  X.fillText('◀ ▶ STEER · ⚡ GAS (ArrowUp) · 🔥 TURBO overheats!', W / 2, H / 2 + 6);
  X.fillStyle = '#ffffff33'; X.font = `bold ${Math.min(8, W * 0.024)}px Orbitron,sans-serif`;
  X.fillText('rival bikes · oil slicks · speed bumps · potholes', W / 2, H / 2 + 20);
}

function draw() {
  X.clearRect(0, 0, W, H);
  drawBG();
  drawObstacles();
  drawPlayerBike();
  drawLaneIndicator();
  drawHUD();
  if (phase === 'idle') drawIdle();
}

function endGame() {
  if (phase === 'over') return;
  phase = 'over';
  if (sessionActive) { arcadeSubmitScore('racer', score).catch(() => {}); sessionActive = false; }
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,12,.96);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif';
  el.innerHTML = `<div style="background:linear-gradient(160deg,#0a0002,#150005);border:2px solid #ff2244;border-radius:20px;padding:28px 22px;width:min(320px,90vw);text-align:center">
    <div style="font-size:40px;margin-bottom:8px">🏍</div>
    <div style="font-size:20px;font-weight:900;color:#ff2244;letter-spacing:3px;margin-bottom:14px">RACE OVER</div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px"><span style="color:#666">LAPS DONE</span><span style="color:#ff2244;font-weight:800">${completedLaps}</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px"><span style="color:#666">DISTANCE</span><span style="color:#ff8800;font-weight:800">${distance}m</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px"><span style="color:#666">TIME BONUSES</span><span style="color:#ffcc00;font-weight:800">+${lapBonus}</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:12px"><span style="color:#666">SCORE</span><span style="color:#ffd700;font-weight:800">${score.toLocaleString()}</span></div>
    <button onclick="location.reload()" style="margin-top:16px;width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#ff2244,#cc0022);color:#fff;font-family:Orbitron,sans-serif;font-size:12px;font-weight:900">RACE AGAIN</button>
    <button onclick="location.href='arcade.html'" style="margin-top:8px;width:100%;padding:10px;border-radius:12px;border:1px solid #222;cursor:pointer;background:transparent;color:#555;font-family:Orbitron,sans-serif;font-size:10px">← ARCADE</button>
  </div>`;
  document.body.appendChild(el);
}

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min(100, ts - lastT); lastT = ts;
  if (phase === 'play') update(dt);
  draw();
}

document.addEventListener('keydown', e => {
  if (phase !== 'play') return;
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') steerUp();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') steerDown();
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); keys.throttle = true; }
  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX') { e.preventDefault(); keys.turbo = true; }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.throttle = false;
  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'KeyX') keys.turbo = false;
});

document.addEventListener('DOMContentLoaded', () => {
  renderWalletBar('wbar');
  resize(); initStars(); initLanes();
  phase = 'idle'; initGame();
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
  showGameLobby('racer', () => {
    sessionActive = true;
    phase = 'idle'; initGame(); initStars(); initLanes();
    setTimeout(() => { phase = 'play'; }, 200);
  });
});
</script>
</body>
</html>
