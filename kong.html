<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOKEN KONG — MONET Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script src="/wallet.js"></script>
<script src="/lobby.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body.game-page{background:#000;overflow:hidden;touch-action:none}
body.game-page::before{display:none}
.gw{display:flex;flex-direction:column;height:100vh}
#wbar{text-align:center;padding:3px 10px;background:#000;border-bottom:1px solid #221100;font-size:11px;flex-shrink:0}
.arena{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
#gc{display:block;image-rendering:crisp-edges}
.ctrl{flex-shrink:0;background:rgba(5,2,0,.95);border-top:1px solid #332200;padding:5px 8px}
.cr{display:flex;justify-content:space-between;align-items:center;gap:5px}
.cb{height:54px;border-radius:10px;border:none;font-family:'Orbitron',sans-serif;font-weight:900;cursor:pointer;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;font-size:10px;line-height:1.2}
.cb:active{transform:translateY(3px)!important;box-shadow:0 1px 0!important}
.mv{flex:1;font-size:26px;background:linear-gradient(135deg,#221100,#110900);color:#ff8800;border:1px solid #442200;box-shadow:0 4px 0 #000}
.jp{flex:1.5;background:linear-gradient(135deg,#003322,#001a11);color:#00ff9d;border:1px solid #006633;box-shadow:0 4px 0 #000}
.cl{flex:1.5;background:linear-gradient(135deg,#222200,#111100);color:#ffd700;border:1px solid #444400;box-shadow:0 4px 0 #000}
.home{font-size:18px;color:#333;text-decoration:none;padding:0 4px;align-self:center}
</style>
</head>
<body class="game-page">
<div class="wallet-bar" id="wbar"></div>
<div class="gw">
  <div class="arena"><canvas id="gc"></canvas></div>
  <div class="ctrl">
    <div class="cr">
      <button class="cb mv" ontouchstart="keys.left=true;event.preventDefault()" ontouchend="keys.left=false" onmousedown="keys.left=true" onmouseup="keys.left=false" onmouseleave="keys.left=false">◀</button>
      <button class="cb cl" ontouchstart="keys.up=true;event.preventDefault()" ontouchend="keys.up=false" onmousedown="keys.up=true" onmouseup="keys.up=false" onmouseleave="keys.up=false">⬆<br>CLIMB</button>
      <button class="cb jp" ontouchstart="doJump(event)" onmousedown="doJump()">↑<br>JUMP</button>
      <a class="home" href="arcade.html">⌂</a>
      <button class="cb mv" ontouchstart="keys.right=true;event.preventDefault()" ontouchend="keys.right=false" onmousedown="keys.right=true" onmouseup="keys.right=false" onmouseleave="keys.right=false">▶</button>
    </div>
  </div>
</div>
<script>
const C = document.getElementById('gc'), X = C.getContext('2d');
const GW = 320, GH = 460;
let SC = 1;

function resize() {
  const p = C.parentElement;
  SC = Math.min(p.clientWidth / GW, p.clientHeight / GH);
  C.width = GW * SC; C.height = GH * SC;
}
window.addEventListener('resize', () => { resize(); });

// Platform definitions: {x1, x2, y} in logical coords
const PLATS = [
  { x1: 0,  x2: 320, y: 444 }, // P0 ground
  { x1: 0,  x2: 272, y: 360 }, // P1
  { x1: 48, x2: 320, y: 276 }, // P2
  { x1: 0,  x2: 272, y: 192 }, // P3
  { x1: 48, x2: 320, y: 108 }, // P4 top — Kong at left, prize at right
];
// Ladder definitions: {x, y1 (top), y2 (bottom)}
const LADDERS = [
  { x: 248, y1: 360, y2: 444 },
  { x: 72,  y1: 276, y2: 360 },
  { x: 248, y1: 192, y2: 276 },
  { x: 72,  y1: 108, y2: 192 },
];
const KONG_X = 78, KONG_Y = 88;
const PRIZE_X = 296, PRIZE_Y = 82;
const CHAR_W = 24, CHAR_H = 30;
const BARREL_R = 10;
const PH = 10;
const LW = 6;

// Barrel direction per floor: even=right, odd=left
function bDir(floor) { return floor % 2 === 0 ? 1 : -1; }

let player, barrels, floatTexts, stars;
let score, lives, round, phase, rafId, lastT = 0;
let kongThrowTimer = 3000, kongFrame = 0;
let sessionActive = false;
const keys = { left: false, right: false, up: false };
const charImg = new Image(); charImg.src = '/dino-sprite.png';

function initStars() {
  stars = Array.from({ length: 55 }, () => ({
    x: Math.random() * GW, y: Math.random() * GH * 0.45,
    r: 0.4 + Math.random() * 1.2, twinkle: Math.random() * Math.PI * 2
  }));
}

function initGame() {
  score = 0; lives = 3; round = 1; phase = 'play';
  initRound();
}

function initRound() {
  player = {
    x: 14, y: PLATS[0].y - CHAR_H,
    vy: 0, onGround: true, onLadder: false, ladderX: 0,
    facing: 1, invTimer: 0,
  };
  barrels = [];
  floatTexts = [];
  kongThrowTimer = 3000;
}

function doJump(e) {
  if (e) e.preventDefault();
  if (phase !== 'play') return;
  if (player.onLadder) { player.onLadder = false; player.vy = -9; return; }
  if (player.onGround) { player.vy = -10.5; player.onGround = false; }
}

function loseLife() {
  if (player.invTimer > 0) return;
  lives--;
  player.invTimer = 2500;
  player.x = 14; player.y = PLATS[0].y - CHAR_H;
  player.vy = 0; player.onGround = true; player.onLadder = false;
  floatTexts.push({ x: GW / 2, y: GH / 2 - 20, txt: '💥 CRASHED!', col: '#ff4444', life: 60, vy: -0.4 });
  if (lives <= 0) { setTimeout(endGame, 600); }
}

function winRound() {
  const bonus = 800 + round * 200;
  score += bonus;
  floatTexts.push({ x: GW / 2, y: GH / 2 - 30, txt: 'BLOCK CONFIRMED! +' + bonus, col: '#ffd700', life: 90, vy: -0.3 });
  round++;
  setTimeout(() => { if (phase === 'play') initRound(); }, 2500);
}

function update(dt) {
  if (phase !== 'play') return;
  const s = dt / 16;
  kongFrame += dt;
  if (player.invTimer > 0) player.invTimer = Math.max(0, player.invTimer - dt);

  // Kong throw timer
  kongThrowTimer -= dt;
  if (kongThrowTimer <= 0) {
    kongThrowTimer = Math.max(1200, 3200 - round * 180);
    barrels.push({
      x: KONG_X + 22, y: PLATS[4].y - BARREL_R,
      vx: bDir(4) * (2.2 + round * 0.32),
      floor: 4, falling: false, fallVy: 0, scored: false, remove: false
    });
  }

  // Player
  if (player.onLadder) {
    player.x = player.ladderX - CHAR_W / 2;
    if (keys.up) player.y -= 1.7 * s;
    if (keys.down) player.y += 1.7 * s;
    const lad = LADDERS.find(l => Math.abs(l.x - player.ladderX) < 2);
    if (lad) {
      if (player.y + CHAR_H <= lad.y1 + 2) {
        player.y = lad.y1 - CHAR_H; player.onLadder = false; player.onGround = true; player.vy = 0;
      }
      if (player.y + CHAR_H > lad.y2 + 4) {
        player.onLadder = false; player.vy = 0;
      }
    }
  } else {
    if (!player.onGround) player.vy += 0.58 * s;
    player.y += player.vy * s;
    if (keys.left)  { player.x -= 2.3 * s; player.facing = -1; }
    else if (keys.right) { player.x += 2.3 * s; player.facing = 1; }
    player.x = Math.max(0, Math.min(GW - CHAR_W, player.x));

    player.onGround = false;
    for (const p of PLATS) {
      if (player.x + CHAR_W > p.x1 + 4 && player.x < p.x2 - 4 &&
          player.y + CHAR_H >= p.y - 2 && player.y + CHAR_H <= p.y + 18 && player.vy >= 0) {
        player.y = p.y - CHAR_H; player.vy = 0; player.onGround = true; break;
      }
    }
    if (player.y > GH + 20) loseLife();

    // Ladder entry
    if (keys.up && player.onGround) {
      for (const lad of LADDERS) {
        const cx = player.x + CHAR_W / 2;
        if (Math.abs(cx - lad.x) < 20 &&
            player.y + CHAR_H >= lad.y2 - 8 && player.y + CHAR_H <= lad.y2 + 10) {
          player.onLadder = true; player.ladderX = lad.x; player.y = lad.y2 - CHAR_H; break;
        }
      }
    }
  }

  // Barrels
  for (let i = barrels.length - 1; i >= 0; i--) {
    const b = barrels[i];
    if (b.remove) { barrels.splice(i, 1); continue; }
    updateBarrel(b, s);
  }

  // Prize collision
  const pcx = player.x + CHAR_W / 2, pcy = player.y + CHAR_H / 2;
  if (Math.abs(pcx - PRIZE_X) < 26 && Math.abs(pcy - PRIZE_Y) < 28) winRound();

  // Barrel hit & jump-over
  if (player.invTimer <= 0) {
    for (const b of barrels) {
      if (b.remove) continue;
      const d = Math.sqrt((pcx - b.x) ** 2 + (pcy - b.y) ** 2);
      if (d < BARREL_R + 11) { loseLife(); break; }
      if (!b.scored && !b.falling && !player.onGround && !player.onLadder) {
        if (Math.abs(pcx - b.x) < 28 && pcy < b.y - 4) {
          b.scored = true; score += 100;
          floatTexts.push({ x: b.x, y: b.y - 24, txt: '+100 TX SKIPPED!', col: '#ffd700', life: 44, vy: -0.5 });
        }
      }
    }
  }

  // Float texts
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i]; f.y += f.vy; f.life--;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
}

function updateBarrel(b, s) {
  if (b.falling) {
    b.fallVy += 0.48 * s;
    b.y += b.fallVy * s;
    const target = PLATS[b.floor].y - BARREL_R;
    if (b.y >= target) { b.y = target; b.falling = false; b.fallVy = 0; }
    return;
  }
  b.x += b.vx * s;
  const p = PLATS[b.floor];
  if (b.vx > 0 && b.x > p.x2 + BARREL_R) {
    if (b.floor === 0) { b.remove = true; return; }
    b.floor--;
    b.x = PLATS[b.floor].x2 - BARREL_R - 2;
    b.vx = bDir(b.floor) * Math.abs(b.vx);
    b.y = p.y - BARREL_R;
    b.falling = true; b.fallVy = 0;
  } else if (b.vx < 0 && b.x < p.x1 - BARREL_R) {
    if (b.floor === 0) { b.remove = true; return; }
    b.floor--;
    b.x = PLATS[b.floor].x1 + BARREL_R + 2;
    b.vx = bDir(b.floor) * Math.abs(b.vx);
    b.y = p.y - BARREL_R;
    b.falling = true; b.fallVy = 0;
  }
}

function drawPlatform(p, idx) {
  const grd = X.createLinearGradient(0, p.y * SC, 0, (p.y + PH) * SC);
  grd.addColorStop(0, '#9a7040'); grd.addColorStop(1, '#4a2810');
  X.fillStyle = grd;
  X.fillRect(p.x1 * SC, p.y * SC, (p.x2 - p.x1) * SC, PH * SC);
  X.fillStyle = '#c09050';
  X.fillRect(p.x1 * SC, p.y * SC, (p.x2 - p.x1) * SC, 2 * SC);
  X.fillStyle = '#3a1a06';
  X.fillRect(p.x1 * SC, (p.y + PH - 2) * SC, (p.x2 - p.x1) * SC, 2 * SC);
  X.fillStyle = '#5a380888';
  X.font = `bold ${6 * SC}px Orbitron,sans-serif`; X.textAlign = 'left';
  X.fillText('LAYER ' + idx, (p.x1 + 8) * SC, (p.y + 7) * SC);
  X.fillStyle = '#3a1a0855';
  for (let rx = p.x1 + 20; rx < p.x2 - 10; rx += 28) {
    X.beginPath(); X.arc(rx * SC, (p.y + PH / 2) * SC, 2.5 * SC, 0, Math.PI * 2); X.fill();
  }
}

function drawLadder(lad) {
  X.strokeStyle = '#886633'; X.lineWidth = 3 * SC;
  X.beginPath(); X.moveTo((lad.x - LW) * SC, lad.y1 * SC); X.lineTo((lad.x - LW) * SC, lad.y2 * SC); X.stroke();
  X.beginPath(); X.moveTo((lad.x + LW) * SC, lad.y1 * SC); X.lineTo((lad.x + LW) * SC, lad.y2 * SC); X.stroke();
  X.lineWidth = 2 * SC; X.strokeStyle = '#664422';
  for (let ry = lad.y1 + 10; ry < lad.y2; ry += 14) {
    X.beginPath(); X.moveTo((lad.x - LW) * SC, ry * SC); X.lineTo((lad.x + LW) * SC, ry * SC); X.stroke();
  }
}

function drawKong() {
  const kx = KONG_X * SC, ky = KONG_Y * SC;
  const t = SC;
  const throwUp = Math.sin(kongFrame * 0.003) > 0;
  X.save(); X.translate(kx, ky);
  // Body
  X.fillStyle = '#9b5523';
  X.beginPath(); X.ellipse(0, 0, 21 * t, 19 * t, 0, 0, Math.PI * 2); X.fill();
  // Chest highlight
  X.fillStyle = '#b86830';
  X.beginPath(); X.ellipse(-1 * t, -2 * t, 12 * t, 10 * t, 0, 0, Math.PI * 2); X.fill();
  // Head
  X.fillStyle = '#9b5523';
  X.beginPath(); X.ellipse(2 * t, -24 * t, 15 * t, 13 * t, 0, 0, Math.PI * 2); X.fill();
  // Face
  X.fillStyle = '#c88050';
  X.beginPath(); X.ellipse(2 * t, -22 * t, 9 * t, 8 * t, 0, 0, Math.PI * 2); X.fill();
  // Eyes
  X.fillStyle = '#000';
  X.beginPath(); X.arc(-2 * t, -26 * t, 2.5 * t, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(6 * t, -26 * t, 2.5 * t, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#fff';
  X.beginPath(); X.arc(-1.5 * t, -26.5 * t, 0.9 * t, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(6.5 * t, -26.5 * t, 0.9 * t, 0, Math.PI * 2); X.fill();
  // Frown
  X.strokeStyle = '#4a1a00'; X.lineWidth = 1.8 * t; X.lineCap = 'round';
  X.beginPath(); X.arc(2 * t, -18 * t, 5 * t, 0.15, Math.PI - 0.15); X.stroke();
  // Throwing arm
  X.strokeStyle = '#7a3e18'; X.lineWidth = 8 * t; X.lineCap = 'round';
  const armY = throwUp ? -20 * t : -8 * t;
  X.beginPath(); X.moveTo(19 * t, -2 * t); X.lineTo(28 * t, armY); X.stroke();
  X.fillStyle = '#5a2c0a'; X.beginPath(); X.arc(28 * t, armY, 5 * t, 0, Math.PI * 2); X.fill();
  // Left arm
  X.strokeStyle = '#7a3e18'; X.lineWidth = 8 * t;
  X.beginPath(); X.moveTo(-19 * t, -2 * t); X.lineTo(-27 * t, 10 * t); X.stroke();
  X.fillStyle = '#5a2c0a'; X.beginPath(); X.arc(-27 * t, 10 * t, 5 * t, 0, Math.PI * 2); X.fill();
  // Legs
  X.strokeStyle = '#7a3e18'; X.lineWidth = 7 * t;
  X.beginPath(); X.moveTo(-8 * t, 18 * t); X.lineTo(-10 * t, 33 * t); X.stroke();
  X.beginPath(); X.moveTo(8 * t, 18 * t); X.lineTo(10 * t, 33 * t); X.stroke();
  X.fillStyle = '#5a2c0a';
  X.beginPath(); X.ellipse(-10 * t, 33 * t, 8 * t, 5 * t, 0, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.ellipse(10 * t, 33 * t, 8 * t, 5 * t, 0, 0, Math.PI * 2); X.fill();
  X.restore();
  X.fillStyle = '#ff8800'; X.font = `bold ${7 * SC}px Orbitron,sans-serif`;
  X.textAlign = 'center'; X.shadowBlur = 10; X.shadowColor = '#ff880066';
  X.fillText('MONET KONG', kx, (KONG_Y - 42) * SC); X.shadowBlur = 0;
}

function drawPrize() {
  const px = PRIZE_X * SC, py = PRIZE_Y * SC;
  const pulse = 0.88 + 0.12 * Math.sin(Date.now() * 0.004);
  X.save(); X.translate(px, py); X.scale(pulse, pulse);
  const g = X.createRadialGradient(0, -3 * SC, SC, 0, 0, 16 * SC);
  g.addColorStop(0, '#fff5a0'); g.addColorStop(0.5, '#ffd700'); g.addColorStop(1, '#cc9900');
  X.fillStyle = g; X.beginPath(); X.arc(0, 0, 16 * SC, 0, Math.PI * 2); X.fill();
  X.strokeStyle = '#fff7b0'; X.lineWidth = 2 * SC; X.stroke();
  X.fillStyle = '#7a4a00'; X.font = `bold ${14 * SC}px Orbitron,sans-serif`;
  X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText('M', 0, SC);
  X.restore();
  X.textBaseline = 'alphabetic';
  X.fillStyle = '#ffd700'; X.font = `bold ${6.5 * SC}px Orbitron,sans-serif`; X.textAlign = 'center';
  X.shadowBlur = 8; X.shadowColor = '#ffd700';
  X.fillText('MONET PRIZE', PRIZE_X * SC, (PRIZE_Y - 22) * SC); X.shadowBlur = 0;
}

function drawBarrel(b) {
  const bx = b.x * SC, by = b.y * SC, r = BARREL_R * SC;
  const rot = (b.x * 0.04) % (Math.PI * 2);
  X.save(); X.translate(bx, by); X.rotate(rot);
  const g = X.createRadialGradient(-r * .32, -r * .32, r * .08, 0, 0, r);
  g.addColorStop(0, '#ffaa30'); g.addColorStop(.5, '#cc5500'); g.addColorStop(1, '#551a00');
  X.fillStyle = g; X.beginPath(); X.arc(0, 0, r, 0, Math.PI * 2); X.fill();
  X.strokeStyle = '#33100066'; X.lineWidth = 1.5 * SC;
  X.beginPath(); X.moveTo(-r * .75, -r * .38); X.lineTo(r * .75, -r * .38); X.stroke();
  X.beginPath(); X.moveTo(-r * .75, r * .38); X.lineTo(r * .75, r * .38); X.stroke();
  X.restore();
  X.fillStyle = '#ffe8b0'; X.font = `bold ${6 * SC}px Orbitron,sans-serif`;
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText('TX', bx, by);
  X.textBaseline = 'alphabetic';
}

function drawPlayer() {
  const px = player.x * SC, py = player.y * SC;
  const cw = CHAR_W * SC, ch = CHAR_H * SC;
  if (player.invTimer > 0 && Math.floor(player.invTimer / 120) % 2 === 1) return;
  X.save();
  if (player.facing === -1) {
    X.translate(px + cw, 0); X.scale(-1, 1);
    if (charImg.complete && charImg.naturalWidth > 0) X.drawImage(charImg, 0, py, cw, ch);
    else { X.fillStyle = '#22bb44'; X.fillRect(0, py, cw, ch); }
  } else {
    if (charImg.complete && charImg.naturalWidth > 0) X.drawImage(charImg, px, py, cw, ch);
    else { X.fillStyle = '#22bb44'; X.fillRect(px, py, cw, ch); }
  }
  X.restore();
}

function drawHUD() {
  X.fillStyle = '#ff8800'; X.font = `bold ${10 * SC}px Orbitron,sans-serif`;
  X.textAlign = 'left'; X.shadowBlur = 8; X.shadowColor = '#ff880066';
  X.fillText('SCORE ' + score.toLocaleString(), 8 * SC, 16 * SC); X.shadowBlur = 0;
  X.fillStyle = '#ffd700'; X.textAlign = 'center';
  X.fillText('ROUND ' + round, GW / 2 * SC, 16 * SC);
  X.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    X.fillStyle = '#ff4444'; X.fillText('♥', (GW - 8 - i * 18) * SC, 16 * SC);
  }
}

function draw() {
  X.clearRect(0, 0, C.width, C.height);
  const sky = X.createLinearGradient(0, 0, 0, C.height);
  sky.addColorStop(0, '#000310'); sky.addColorStop(1, '#0a0518');
  X.fillStyle = sky; X.fillRect(0, 0, C.width, C.height);
  stars.forEach(s => {
    const a = 0.3 + 0.3 * Math.sin(s.twinkle + Date.now() * 0.001);
    X.fillStyle = `rgba(255,255,255,${a})`;
    X.beginPath(); X.arc(s.x * SC, s.y * SC, s.r * SC, 0, Math.PI * 2); X.fill();
  });
  // Construction frame
  X.strokeStyle = '#2a1200'; X.lineWidth = 2 * SC;
  X.beginPath(); X.moveTo(36 * SC, 0); X.lineTo(36 * SC, GH * SC); X.stroke();
  X.beginPath(); X.moveTo(284 * SC, 0); X.lineTo(284 * SC, GH * SC); X.stroke();
  LADDERS.forEach(l => drawLadder(l));
  PLATS.forEach((p, i) => drawPlatform(p, i));
  drawKong();
  drawPrize();
  barrels.forEach(b => { if (!b.remove) drawBarrel(b); });
  drawPlayer();
  floatTexts.forEach(f => {
    X.save(); X.globalAlpha = Math.max(0, f.life / 60);
    X.fillStyle = f.col; X.font = `bold ${8 * SC}px Orbitron,sans-serif`;
    X.textAlign = 'center'; X.shadowBlur = 8; X.shadowColor = f.col;
    X.fillText(f.txt, f.x * SC, f.y * SC); X.restore();
  });
  drawHUD();
  if (phase === 'idle') {
    X.fillStyle = 'rgba(0,2,8,.78)'; X.fillRect(0, 0, C.width, C.height);
    X.fillStyle = '#ff8800'; X.font = `bold ${18 * SC}px Orbitron,sans-serif`;
    X.textAlign = 'center'; X.shadowBlur = 22; X.shadowColor = '#ff8800';
    X.fillText('TOKEN KONG', GW / 2 * SC, GH / 2 * SC - 14 * SC);
    X.shadowBlur = 0; X.fillStyle = '#ffffff55'; X.font = `bold ${7.5 * SC}px Orbitron,sans-serif`;
    X.fillText('climb to the MONET prize · jump over TX barrels', GW / 2 * SC, GH / 2 * SC + 6 * SC);
  }
}

function endGame() {
  phase = 'over';
  if (sessionActive) { arcadeSubmitScore('kong', score).catch(() => {}); sessionActive = false; }
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,8,.96);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif';
  b.innerHTML = `<div style="background:linear-gradient(160deg,#0d0500,#1a0a00);border:2px solid #ff8800;border-radius:20px;padding:28px 22px;width:min(320px,90vw);text-align:center">
    <div style="font-size:42px;margin-bottom:8px">🦍</div>
    <div style="font-size:20px;font-weight:900;color:#ff8800;letter-spacing:3px;margin-bottom:14px">GAME OVER</div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px"><span style="color:#666">FINAL SCORE</span><span style="color:#ff8800;font-weight:800">${score.toLocaleString()}</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:12px"><span style="color:#666">ROUNDS CLEARED</span><span style="color:#ffd700;font-weight:800">${Math.max(0, round - 1)}</span></div>
    <button onclick="location.reload()" style="margin-top:16px;width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#ff8800,#cc4400);color:#000;font-family:Orbitron,sans-serif;font-size:12px;font-weight:900">PLAY AGAIN</button>
    <button onclick="location.href='arcade.html'" style="margin-top:8px;width:100%;padding:10px;border-radius:12px;border:1px solid #222;cursor:pointer;background:transparent;color:#555;font-family:Orbitron,sans-serif;font-size:10px">← ARCADE</button>
  </div>`;
  document.body.appendChild(b);
}

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min(100, ts - lastT); lastT = ts;
  if (phase === 'play') update(dt);
  draw();
}

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'ArrowUp')   keys.up = true;
  if (e.code === 'Space' || e.code === 'KeyZ') { e.preventDefault(); doJump(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft')  keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
  if (e.code === 'ArrowUp')   keys.up = false;
});

document.addEventListener('DOMContentLoaded', () => {
  renderWalletBar('wbar');
  resize(); initStars();
  phase = 'idle'; initGame();
  lastT = performance.now();
  rafId = requestAnimationFrame(loop);
  showGameLobby('kong', () => {
    sessionActive = true;
    phase = 'idle'; initGame(); initStars();
    setTimeout(() => { phase = 'play'; }, 200);
  });
});
</script>
</body>
</html>
