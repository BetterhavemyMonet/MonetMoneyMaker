<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center">

<h2>Click Speed (Winner Takes Pot)</h2>

<p>Entry Fee: 1 MONET</p>
<p>Pot: <span id="pot">0</span> MONET</p>

<button onclick="enter()">Enter Game</button>
<br><br>

<button onclick="click()">CLICK FAST</button>

<p>Score: <span id="score">0</span></p>

<script>
let score = 0;
let entered = false;

// load pot
let pot = parseInt(localStorage.getItem("pot") || "0");
document.getElementById("pot").innerText = pot;

function enter() {
  if (entered) return;

  entered = true;

  pot += 1;
  localStorage.setItem("pot", pot);
  document.getElementById("pot").innerText = pot;

  alert("You entered the game!");
}

function click() {
  if (!entered) {
    alert("You must enter first!");
    return;
  }

  score++;
  document.getElementById("score").innerText = score;

  // simple win condition
  if (score >= 20) {
    let winnerShare = Math.floor(pot * 0.8);
    let treasury = pot - winnerShare;

    alert(
      "YOU WIN!\n\n" +
      "You get: " + winnerShare + " MONET\n" +
      "Treasury gets: " + treasury + " MONET"
    );

    // reset pot
    pot = 0;
    localStorage.setItem("pot", pot);
    document.getElementById("pot").innerText = pot;

    score = 0;
    entered = false;
  }
}
</script>

</body>
</html>
