<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<h2>Click Speed (Pot Game)</h2>

<p>Pot: <span id="pot">0</span> MONET</p>
<button onclick="enter()">Enter (1 MONET)</button>

<br><br>
<button onclick="click()">CLICK</button>

<p>Score: <span id="score">0</span></p>

<script>
let pot = parseInt(localStorage.getItem("pot") || 0);
let score = 0;
let entered = false;

document.getElementById("pot").innerText = pot;

function enter(){
  if(entered) return;

  entered = true;
  pot += 1;
  localStorage.setItem("pot", pot);
  document.getElementById("pot").innerText = pot;
}

function click(){
  if(!entered){
    alert("Enter first!");
    return;
  }

  score++;
  document.getElementById("score").innerText = score;

  if(score >= 20){
    let win = Math.floor(pot * 0.8);
    let treasury = pot - win;

    alert("WINNER!\nYou get " + win + "\nTreasury gets " + treasury);

    pot = 0;
    localStorage.setItem("pot", pot);
    document.getElementById("pot").innerText = pot;

    score = 0;
    entered = false;
  }
}
</script>

</body>
</html>
