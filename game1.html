<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<h2>Click Speed (Auto Payout)</h2>

<button onclick="enter()">Enter Game</button>
<br><br>

<button onclick="click()">CLICK</button>

<p>Score: <span id="score">0</span></p>

<script>
let score = 0;
let sessionId = null;

// ENTER
async function enter(){
  const wallet = window.solana.publicKey.toString();

  const res = await fetch("http://localhost:3001/enter", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ wallet })
  });

  const data = await res.json();
  sessionId = data.sessionId;

  alert("Entered game!");
}

// GAME
function click(){
  if(!sessionId){
    alert("Enter first!");
    return;
  }

  score++;
  document.getElementById("score").innerText = score;

  if(score >= 20){
    win();
  }
}

// WIN
async function win(){
  const res = await fetch("http://localhost:3001/win", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ sessionId })
  });

  const data = await res.json();

  if(data.error){
    alert("Invalid win");
    return;
  }

  alert(
    "YOU WON!\n\n" +
    "Payout: " + data.payout
  );

  score = 0;
  sessionId = null;
}
</script>

</body>
</html>
