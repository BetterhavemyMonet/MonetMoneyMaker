<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Monet Kart | Monet Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script src="/wallet.js"></script>
<style>
#k-hud {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 14px; background: rgba(0,0,0,0.7); flex-shrink: 0;
  font-family: 'Orbitron', sans-serif; font-size: 11px; color: #fff;
  border-bottom: 1px solid rgba(168,85,255,0.3);
}
#k-hud span { display: flex; align-items: center; gap: 5px; }
#k-item-icon {
  display: inline-block; min-width: 22px; text-align: center;
  background: rgba(168,85,255,0.3); border: 1px solid #a855ff55;
  border-radius: 6px; padding: 1px 5px; font-size: 13px;
}
#k-overlay {
  position: absolute; inset: 0; background: rgba(2,4,10,0.88); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif; text-align: center;
}
#k-overlay-box {
  padding: 30px 26px; background: #0b0f1a; border: 2px solid #a855ff;
  border-radius: 20px; width: min(320px, 90vw); box-shadow: 0 0 48px #a855ff44;
}
#k-overlay-title { font-size: 18px; font-weight: 800; color: #a855ff; margin-bottom: 8px; }
#k-overlay-body  { font-size: 12px; color: #bbb; line-height: 1.6; }
#k-countdown-num { font-size: 72px; font-weight: 800; color: #ffd700; text-shadow: 0 0 32px #ffd70099; line-height:1; margin: 8px 0; }
#k-result {
  position: fixed; inset: 0; background: rgba(2,4,10,0.97); z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif;
}
</style>
</head>
<body class="game-page">

<div class="wallet-bar" id="wbar" style="flex-shrink:0"></div>

<div class="game-wrap" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative">
  <div id="k-hud">
    <span>🏁 <span id="k-lap">Lap 1/3</span></span>
    <span>📍 <span id="k-pos">Pos —</span></span>
    <span>⏱ <span id="k-time">0:00</span></span>
    <span>Item: <span id="k-item-icon">—</span></span>
  </div>

  <div class="canvas-wrap" id="cvwrap"
       style="flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center">
    <canvas id="kc"></canvas>
    <div id="k-overlay">
      <div id="k-overlay-box">
        <div id="k-overlay-title">MONET KART</div>
        <div id="k-overlay-body">Pay to enter and race for MONET!</div>
      </div>
    </div>
  </div>
</div>

<!-- Controller -->
<div class="ctrl-area">
  <div class="ctrl-body">
    <div class="ctrl-dpad">
      <div class="ctrl-dpad-center"></div>
      <button class="dpad-up"
        ontouchstart="inp.up=true;event.preventDefault()"
        ontouchend="inp.up=false"
        onmousedown="inp.up=true" onmouseup="inp.up=false">▲</button>
      <button class="dpad-down"
        ontouchstart="inp.down=true;event.preventDefault()"
        ontouchend="inp.down=false"
        onmousedown="inp.down=true" onmouseup="inp.down=false">▼</button>
      <button class="dpad-left"
        ontouchstart="inp.left=true;event.preventDefault()"
        ontouchend="inp.left=false"
        onmousedown="inp.left=true" onmouseup="inp.left=false">◀</button>
      <button class="dpad-right"
        ontouchstart="inp.right=true;event.preventDefault()"
        ontouchend="inp.right=false"
        onmousedown="inp.right=true" onmouseup="inp.right=false">▶</button>
    </div>
    <div class="ctrl-mid">
      <a class="ctrl-home" href="arcade.html">⌂</a>
    </div>
    <div class="ctrl-ab">
      <button class="ctrl-btn-a"
        ontouchstart="inp.up=true;event.preventDefault()"
        ontouchend="inp.up=false"
        onmousedown="inp.up=true" onmouseup="inp.up=false">GAS</button>
      <button class="ctrl-btn-b"
        ontouchstart="useItem();event.preventDefault()"
        onmousedown="useItem()">ITEM</button>
    </div>
  </div>
</div>

<script>
// ─── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('kc');
const ctx    = canvas.getContext('2d');
const GW = 600, GH = 360;
canvas.width  = GW;
canvas.height = GH;

function resizeCanvas() {
  const wrap  = document.getElementById('cvwrap');
  const scale = Math.min(wrap.clientWidth / GW, wrap.clientHeight / GH);
  canvas.style.width  = Math.floor(GW * scale) + 'px';
  canvas.style.height = Math.floor(GH * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);

// ─── Track geometry ───────────────────────────────────────────────────────────
const CX = 300, CY = 172;       // track center
const ORX = 255, ORY = 138;     // outer ellipse radii
const IRX = 168, IRY = 68;      // inner ellipse radii

// Kart starting positions (bottom of oval, facing up)
const START_POS = [
  { x:308, y:308, angle:-Math.PI/2 },
  { x:282, y:308, angle:-Math.PI/2 },
  { x:308, y:326, angle:-Math.PI/2 },
  { x:282, y:326, angle:-Math.PI/2 },
];

function onTrack(x, y) {
  const dx = x - CX, dy = y - CY;
  const outer = (dx*dx)/(ORX*ORX) + (dy*dy)/(ORY*ORY);
  const inner = (dx*dx)/(IRX*IRX) + (dy*dy)/(IRY*IRY);
  return outer <= 1.04 && inner >= 0.96;
}

// Item box positions (on track: top, right, bottom-left, left)
const ITEM_BOXES = [
  { x:300, y:47,  active:true, respawnAt:0 },
  { x:540, y:172, active:true, respawnAt:0 },
  { x:180, y:290, active:true, respawnAt:0 },
  { x:60,  y:172, active:true, respawnAt:0 },
];
const ITEM_RESPAWN_MS = 12000;

// ─── Camera / perspective constants ───────────────────────────────────────────
const CAM_H    = 55;                       // camera height above road
const FOCAL    = 215;                      // focal length (higher = tighter FOV)
const HORIZON  = Math.round(GH * 0.38);   // screen-Y where sky meets road (~137)

function worldToScreen(wx, wy) {
  if (!myKart) return null;
  const dx = wx - myKart.x, dy = wy - myKart.y;
  const ca = Math.cos(myKart.angle), sa = Math.sin(myKart.angle);
  const camZ =  dx * ca + dy * sa;   // depth (forward)
  const camX = -dx * sa + dy * ca;   // lateral
  if (camZ <= 0.5) return null;
  return {
    x: GW / 2 + FOCAL * camX / camZ,
    y: HORIZON  + FOCAL * CAM_H  / camZ,
    scale: FOCAL / camZ,
    camZ,
  };
}

// ─── Physics constants ────────────────────────────────────────────────────────
const MAX_SPD  = 4.6;
const ACCEL    = 0.14;
const BRAKE_F  = 0.24;
const FRIC     = 0.924;
const TURN_R   = 0.054;
const BOOST_DUR = 120; // frames

// ─── Game state ───────────────────────────────────────────────────────────────
let inp = { up:false, down:false, left:false, right:false };
let gamePhase = 'idle'; // idle | waiting | countdown | racing | finishing | finished
let myId = null, myColor = null;
let myKart  = null;
let others  = [];
let ws      = null;
let raceStartTime = 0;
let sendTick = 0;
let totalPlayers = 1;

// ─── CPU kart (solo vs CPU race) ──────────────────────────────────────────────
// CPU follows the center of the oval at a fixed angular rate.
// 16 s/lap = medium difficulty — a player at full throttle laps in ~7 s.
const CPU_MID_RX   = (ORX + IRX) / 2;           // 211.5 px
const CPU_MID_RY   = (ORY + IRY) / 2;           // 103 px
const CPU_LAP_SECS = 16;                          // adjust to taste
const CPU_RATE     = (2 * Math.PI) / (CPU_LAP_SECS * 60); // rad / frame
let cpuKart = null; // null = multiplayer race

// ─── Kart factory ─────────────────────────────────────────────────────────────
function makeKart(sp, color, id) {
  return {
    x: sp.x, y: sp.y, angle: sp.angle, speed: 0,
    color, id,
    lap: 0, finished: false,
    passedR: false, passedT: false, passedL: false,
    item: null, boostTimer: 0, spinTimer: 0,
  };
}

// ─── Physics update ───────────────────────────────────────────────────────────
function updateMyKart() {
  if (!myKart || gamePhase !== 'racing') return;

  const onRoad   = onTrack(myKart.x, myKart.y);
  const speedCap = onRoad ? MAX_SPD : MAX_SPD * 0.55;
  const fric     = onRoad ? FRIC    : 0.87;

  if (myKart.spinTimer > 0) {
    myKart.spinTimer--;
    myKart.angle += 0.24;
    myKart.speed *= 0.82;
  } else {
    if (myKart.boostTimer > 0) {
      myKart.boostTimer--;
      myKart.speed = Math.min(myKart.speed + ACCEL * 1.6, speedCap * 1.5);
    } else if (inp.up) {
      myKart.speed = Math.min(myKart.speed + ACCEL, speedCap);
    } else if (inp.down) {
      myKart.speed = Math.max(myKart.speed - BRAKE_F, -speedCap * 0.35);
    } else {
      myKart.speed *= fric;
    }
    if (Math.abs(myKart.speed) > 0.05) {
      const tm  = Math.min(Math.abs(myKart.speed) / MAX_SPD, 1);
      const dir = myKart.speed >= 0 ? 1 : -1;
      if (inp.left)  myKart.angle -= TURN_R * tm * dir;
      if (inp.right) myKart.angle += TURN_R * tm * dir;
    }
  }

  const nx = myKart.x + Math.cos(myKart.angle) * myKart.speed;
  const ny = myKart.y + Math.sin(myKart.angle) * myKart.speed;

  if      (onTrack(nx, ny))         { myKart.x = nx; myKart.y = ny; }
  else if (onTrack(nx, myKart.y))   { myKart.x = nx; myKart.speed *= 0.5; }
  else if (onTrack(myKart.x, ny))   { myKart.y = ny; myKart.speed *= 0.5; }
  else                               { myKart.speed *= -0.35; }

  checkLap();
  checkItemPickup();
  updateHUD();
}

// ─── CPU kart update (called every frame while racing) ────────────────────────
function updateCpuKart() {
  if (!cpuKart || gamePhase !== 'racing' || cpuKart.finished) return;

  // Advance angle clockwise (decreasing)
  cpuKart.angle    -= CPU_RATE;
  cpuKart.traveled += CPU_RATE;

  // Position: center of track oval
  cpuKart.x      = CX + Math.cos(cpuKart.angle) * CPU_MID_RX;
  cpuKart.y      = CY + Math.sin(cpuKart.angle) * CPU_MID_RY;
  // Facing: tangent to ellipse going clockwise
  cpuKart.facing = Math.atan2(-CPU_MID_RY * Math.cos(cpuKart.angle),
                               CPU_MID_RX * Math.sin(cpuKart.angle));

  // Lap counting: each full 2π of travel = one lap
  if (cpuKart.traveled >= Math.PI * 2 * (cpuKart.lap + 1)) {
    cpuKart.lap++;
    if (cpuKart.lap >= 3) {
      cpuKart.finished = true;
      if (gamePhase === 'racing') {
        gamePhase = 'finished';
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'cpu_won' }));
        showResult(false, 0, 'CPU');
      }
    }
  }
}

// ─── Lap counting (clockwise: right → top → left → finish) ───────────────────
function checkLap() {
  if (!myKart || myKart.finished) return;
  const { x, y } = myKart;

  if (x > 492)                              myKart.passedR = true;
  if (y < 53  && myKart.passedR)            myKart.passedT = true;
  if (x < 112 && myKart.passedT)            myKart.passedL = true;

  // Finish line: bottom straight, x ∈ [265,335], y > 292
  if (y > 292 && x > 265 && x < 335 && myKart.passedL) {
    myKart.lap++;
    myKart.passedR = myKart.passedT = myKart.passedL = false;
    if (myKart.lap >= 3) {
      myKart.finished = true;
      gamePhase = 'finishing';
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'finished' }));
    }
  }
}

// ─── Item pickup ──────────────────────────────────────────────────────────────
function checkItemPickup() {
  if (!myKart || myKart.item) return;
  const now = Date.now();
  for (const box of ITEM_BOXES) {
    if (!box.active) {
      if (now >= box.respawnAt) box.active = true;
      continue;
    }
    const dx = myKart.x - box.x, dy = myKart.y - box.y;
    if (dx*dx + dy*dy < 22*22) {
      box.active = false;
      box.respawnAt = now + ITEM_RESPAWN_MS;
      myKart.item = 'boost';
      document.getElementById('k-item-icon').textContent = '⭐';
    }
  }
}

function useItem() {
  if (!myKart || !myKart.item || gamePhase !== 'racing') return;
  if (myKart.item === 'boost') {
    myKart.boostTimer = BOOST_DUR;
    myKart.item = null;
    document.getElementById('k-item-icon').textContent = '—';
  }
}
window.useItem = useItem;

// ─── HUD update ───────────────────────────────────────────────────────────────
function updateHUD() {
  if (!myKart) return;
  const lapNum = Math.min(myKart.lap + 1, 3);
  document.getElementById('k-lap').textContent = `Lap ${lapNum}/3`;

  const myLap  = myKart.lap;
  const cpuLaps = cpuKart ? [cpuKart.lap] : [];
  const allLaps = [myLap, ...others.map(o => o.lap ?? 0), ...cpuLaps];
  const pos     = allLaps.filter(l => l > myLap).length + 1;
  const n       = allLaps.length;
  const ordinal = ['1st','2nd','3rd','4th'][pos-1] ?? `${pos}th`;
  document.getElementById('k-pos').textContent = `${ordinal} of ${n}`;

  if (raceStartTime > 0) {
    const s = Math.floor((Date.now() - raceStartTime) / 1000);
    document.getElementById('k-time').textContent = `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  }
}

// ─── 3-D first-person renderer ────────────────────────────────────────────────
function draw3DScene() {
  // ── Sky ──────────────────────────────────────────────────────────────────────
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#010209');
  sky.addColorStop(1, '#0b1836');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GW, HORIZON);

  // Static stars
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (let i = 0; i < 55; i++) {
    const sx = ((i * 97  +  7) * 1337) % GW;
    const sy = ((i * 53  + 11) *  953) % HORIZON;
    ctx.fillRect(sx, sy, i % 6 === 0 ? 2 : 1, i % 6 === 0 ? 2 : 1);
  }

  // ── Grass ground ─────────────────────────────────────────────────────────────
  const gnd = ctx.createLinearGradient(0, HORIZON, 0, GH);
  gnd.addColorStop(0, '#1a5c1a');
  gnd.addColorStop(1, '#0d3d0d');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, HORIZON, GW, GH - HORIZON);

  if (!myKart) return;

  // ── Sample oval edges ahead of player ────────────────────────────────────────
  const playerAngle = Math.atan2(myKart.y - CY, myKart.x - CX);
  const SEG_N = 95, SEG_STEP = 0.033;
  const segs = [];
  for (let i = 0; i <= SEG_N; i++) {
    const a  = playerAngle - i * SEG_STEP;
    const pi = worldToScreen(CX + IRX * Math.cos(a), CY + IRY * Math.sin(a));
    const po = worldToScreen(CX + ORX * Math.cos(a), CY + ORY * Math.sin(a));
    segs.push({ pi, po, i });
  }

  // Clip all road drawing to below the horizon
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HORIZON, GW, GH - HORIZON);
  ctx.clip();

  // ── Road trapezoids (far → near) ─────────────────────────────────────────────
  for (let i = segs.length - 1; i >= 1; i--) {
    const { pi: pi0, po: po0 } = segs[i];
    const { pi: pi1, po: po1 } = segs[i - 1];
    if (!pi0 || !po0 || !pi1 || !po1) continue;
    const clamp = y => Math.max(y, HORIZON);
    ctx.beginPath();
    ctx.moveTo(pi0.x, clamp(pi0.y));
    ctx.lineTo(po0.x, clamp(po0.y));
    ctx.lineTo(po1.x, clamp(po1.y));
    ctx.lineTo(pi1.x, clamp(pi1.y));
    ctx.closePath();
    ctx.fillStyle = Math.floor(i / 5) % 2 === 0 ? '#4d4d56' : '#45454e';
    ctx.fill();
  }

  // ── Road borders ─────────────────────────────────────────────────────────────
  function drawEdge(pts, color, w) {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); let go = false;
    for (const p of pts) {
      if (!p) { go = false; continue; }
      const y = Math.max(p.y, HORIZON);
      if (!go) { ctx.moveTo(p.x, y); go = true; } else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
  }
  drawEdge(segs.map(s => s.po), '#e0e0e0', 2.5);   // outer white
  drawEdge(segs.map(s => s.pi), '#e0e0e0', 2.5);   // inner white

  // ── Dashed centre line ───────────────────────────────────────────────────────
  ctx.setLineDash([12, 10]);
  ctx.strokeStyle = 'rgba(255,240,80,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); let go2 = false;
  for (const { pi, po } of segs) {
    if (!pi || !po) { go2 = false; continue; }
    const mx = (pi.x + po.x) / 2, my = Math.max((pi.y + po.y) / 2, HORIZON);
    if (!go2) { ctx.moveTo(mx, my); go2 = true; } else ctx.lineTo(mx, my);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Start/finish line (checkered) ────────────────────────────────────────────
  const fl = [
    worldToScreen(268, 292), worldToScreen(328, 292),
    worldToScreen(328, 312), worldToScreen(268, 312),
  ];
  if (fl.every(Boolean)) {
    const lerp = (a, b, t) => a + (b - a) * t;
    const TILES = 6;
    for (let c = 0; c < TILES; c++) {
      const t0 = c / TILES, t1 = (c + 1) / TILES;
      const lx0 = lerp(fl[0].x, fl[3].x, t0), ly0 = Math.max(lerp(fl[0].y, fl[3].y, t0), HORIZON);
      const lx1 = lerp(fl[0].x, fl[3].x, t1), ly1 = Math.max(lerp(fl[0].y, fl[3].y, t1), HORIZON);
      const rx0 = lerp(fl[1].x, fl[2].x, t0), ry0 = Math.max(lerp(fl[1].y, fl[2].y, t0), HORIZON);
      const rx1 = lerp(fl[1].x, fl[2].x, t1), ry1 = Math.max(lerp(fl[1].y, fl[2].y, t1), HORIZON);
      ctx.beginPath();
      ctx.moveTo(lx0, ly0); ctx.lineTo(rx0, ry0);
      ctx.lineTo(rx1, ry1); ctx.lineTo(lx1, ly1);
      ctx.closePath();
      ctx.fillStyle = c % 2 === 0 ? '#fff' : '#111';
      ctx.fill();
    }
  }

  // ── Item boxes ───────────────────────────────────────────────────────────────
  for (const box of ITEM_BOXES) {
    if (!box.active) continue;
    const p = worldToScreen(box.x, box.y);
    if (!p || p.y < HORIZON || p.y > GH + 30) continue;
    const s = Math.min(Math.max(7, 30 * p.scale), 60);
    ctx.fillStyle = '#ffd700'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.fillRect(p.x - s / 2, p.y - s, s, s);
    ctx.strokeRect(p.x - s / 2, p.y - s, s, s);
    ctx.fillStyle = '#000';
    ctx.font = `bold ${Math.max(8, s * 0.65)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', p.x, p.y - s / 2);
    ctx.textBaseline = 'alphabetic';
  }

  // ── Other karts / CPU ────────────────────────────────────────────────────────
  const kartsToDraw = others.map(o => ({ x: o.x, y: o.y, color: o.color, label: o.name || '???' }));
  if (cpuKart) kartsToDraw.push({ x: cpuKart.x, y: cpuKart.y, color: '#888888', label: 'CPU' });
  // Sort far → near so closer karts draw on top
  kartsToDraw.sort((a, b) => {
    const pa = worldToScreen(a.x, a.y), pb = worldToScreen(b.x, b.y);
    return (pb?.camZ ?? 0) - (pa?.camZ ?? 0);
  });
  for (const k of kartsToDraw) drawKart3D(k.x, k.y, k.color, k.label);

  ctx.restore(); // end clip

  // ── Boost speed-lines ────────────────────────────────────────────────────────
  if (myKart && myKart.boostTimer > 0) {
    const alpha = Math.min(myKart.boostTimer / 60, 1) * 0.55;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 14; i++) {
      const lx = (i / 14) * GW;
      const ly = HORIZON + Math.random() * (GH - HORIZON) * 0.55;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 25 + Math.random() * 35); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Speedometer (bottom-right arc gauge) ─────────────────────────────────────
  if (myKart) {
    const spd = Math.max(0, myKart.speed), pct = spd / MAX_SPD;
    const cx2 = GW - 46, cy2 = GH - 36, r = 27;
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx2, cy2, r, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
    const grad = ctx.createLinearGradient(cx2 - r, 0, cx2 + r, 0);
    grad.addColorStop(0, '#00ff88'); grad.addColorStop(0.6, '#ffd700'); grad.addColorStop(1, '#ff4444');
    ctx.strokeStyle = grad; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx2, cy2, r, Math.PI * 0.75, Math.PI * 0.75 + pct * Math.PI * 1.5); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Orbitron, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(spd * 22) + '', cx2, cy2 + 4);
    ctx.font = '7px Orbitron, sans-serif'; ctx.fillStyle = '#aaa';
    ctx.fillText('KPH', cx2, cy2 + 14);
    ctx.restore();
  }
}

function drawKart3D(wx, wy, color, label) {
  const p = worldToScreen(wx, wy);
  if (!p || p.camZ < 2 || p.y > GH + 20 || p.y < HORIZON) return;
  const w = Math.min(Math.max(10, 65 * p.scale), GW * 0.46);
  const h = w * 0.58;
  const x = p.x, y = p.y;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x - w * 0.44 + 3, y - h + 3, w * 0.88, h * 0.9);
  // Body
  ctx.fillStyle = color;
  ctx.fillRect(x - w / 2, y - h, w, h);
  // Windshield
  ctx.fillStyle = 'rgba(180,225,255,0.62)';
  ctx.fillRect(x - w * 0.3, y - h + h * 0.08, w * 0.6, h * 0.32);
  // Wheels
  ctx.fillStyle = '#111';
  const ww = Math.max(3, w * 0.12), wh = Math.max(4, h * 0.38);
  ctx.fillRect(x - w / 2 - ww + 1, y - h * 0.7, ww, wh);
  ctx.fillRect(x + w / 2 - 1,       y - h * 0.7, ww, wh);
  // Label
  if (w > 16) {
    ctx.font = `bold ${Math.max(7, Math.round(w * 0.17))}px Orbitron, sans-serif`;
    ctx.textAlign = 'center';
    const tw = ctx.measureText(label).width + 7;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(x - tw / 2, y - h - 13, tw, 12);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, y - h - 3);
  }
}

// ─── Main render loop ─────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  updateMyKart();
  updateCpuKart();
  draw3DScene();

  // Network: send state ~15×/sec
  if (ws && ws.readyState === 1 && myKart && gamePhase === 'racing') {
    sendTick++;
    if (sendTick % 4 === 0) {
      ws.send(JSON.stringify({
        type: 'state',
        x:     Math.round(myKart.x     * 10) / 10,
        y:     Math.round(myKart.y     * 10) / 10,
        angle: Math.round(myKart.angle * 1000) / 1000,
        speed: Math.round(myKart.speed * 100)  / 100,
        lap:   myKart.lap,
      }));
    }
  }
}

// ─── Overlay helpers ─────────────────────────────────────────────────────────
function showOvl(title, html) {
  const ol = document.getElementById('k-overlay');
  if (!ol) return;
  ol.style.display = 'flex';
  document.getElementById('k-overlay-title').textContent = title;
  document.getElementById('k-overlay-body').innerHTML    = html;
}
function hideOvl() {
  const ol = document.getElementById('k-overlay');
  if (ol) ol.style.display = 'none';
}

function showResult(won, payout, winnerName) {
  const box = document.createElement('div');
  box.id = 'k-result';
  box.innerHTML = `
    <div style="background:#0b0f1a;border:2px solid ${won?'#ffd700':'#a855ff'};
         border-radius:20px;padding:30px 24px;width:min(340px,92vw);text-align:center">
      <div style="font-size:40px;margin-bottom:8px">${won ? '🏆' : '🏎'}</div>
      <div style="font-size:20px;font-weight:800;color:${won?'#ffd700':'#a855ff'};margin-bottom:6px">
        ${won ? 'YOU WIN!' : `${winnerName} WINS!`}
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:18px">
        ${cpuKart ? 'vs CPU' : `${totalPlayers}-player race`} · 3 laps
      </div>
      ${won ? `
        <div style="display:flex;justify-content:space-between;padding:10px 0;
             border-bottom:1px solid #ffffff12;font-size:13px;margin-bottom:14px">
          <span style="color:#888">Payout</span>
          <span style="color:#ffd700;font-weight:800">+${Number(payout).toFixed(1)} MONET</span>
        </div>` : `
        <div style="padding:8px 0;font-size:11px;color:#888;margin-bottom:14px">
          Better luck next time!
        </div>`}
      <button onclick="location.href='arcade.html'"
        style="width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
               background:linear-gradient(135deg,#a855ff,#7c3aed);color:#fff;
               font-family:Orbitron,sans-serif;font-size:12px;font-weight:800;margin-bottom:8px">
        ← BACK TO ARCADE
      </button>
      <button onclick="location.reload()"
        style="width:100%;padding:11px;border-radius:12px;border:1px solid #333;
               cursor:pointer;background:transparent;color:#888;
               font-family:Orbitron,sans-serif;font-size:10px">
        RACE AGAIN
      </button>
    </div>`;
  document.body.appendChild(box);
}

// ─── WebSocket client ─────────────────────────────────────────────────────────
function connectWS(wallet, txId) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/race-ws`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type:'join', wallet, txId }));
    showOvl('FINDING RACE', 'Connecting to race server…');
  };

  ws.onmessage = e => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }

    if (msg.type === 'joined') {
      myId    = msg.yourId;
      myColor = msg.color;
      totalPlayers = msg.playerCount;
      const sp = msg.startPos || START_POS[0];
      myKart = makeKart(sp, myColor, myId);
      gamePhase = 'waiting';
      // Start a 30-second countdown matching the server-side CPU fallback timer
      let secsLeft = 30;
      function updateWaitOvl(count) {
        showOvl('WAITING FOR RACERS',
          `${totalPlayers} / 4 players joined<br>
           <small style="color:#666">Race starts when 2+ players are ready</small><br>
           <small style="color:#555">CPU joins in <b id="k-cpu-timer">${count}</b>s if no one arrives</small>`);
      }
      updateWaitOvl(secsLeft);
      const cpuWaitInterval = setInterval(() => {
        if (gamePhase !== 'waiting') { clearInterval(cpuWaitInterval); return; }
        secsLeft--;
        if (secsLeft <= 0) { clearInterval(cpuWaitInterval); return; }
        const el = document.getElementById('k-cpu-timer');
        if (el) el.textContent = secsLeft;
      }, 1000);
    }

    else if (msg.type === 'room_update') {
      totalPlayers = msg.players.length;
      others = msg.players.filter(p => p.id !== myId)
                          .map(p => ({ ...p, name: shortenWallet(p.wallet) }));
      if (gamePhase === 'waiting') {
        // Update only the player count line; leave CPU timer intact
        const el = document.querySelector('#k-overlay-body');
        if (el) {
          const timerEl = document.getElementById('k-cpu-timer');
          const secsLeft = timerEl ? timerEl.textContent : '…';
          el.innerHTML =
            `${msg.players.length} / 4 players joined<br>
             <small style="color:#666">Race starts when 2+ players are ready</small><br>
             <small style="color:#555">CPU joins in <b id="k-cpu-timer">${secsLeft}</b>s if no one arrives</small>`;
        }
      }
    }

    else if (msg.type === 'countdown') {
      gamePhase = 'countdown';
      showOvl('GET READY!',
        `<div id="k-countdown-num">${msg.count}</div>`);
    }

    else if (msg.type === 'start') {
      others = (msg.players || [])
        .filter(p => p.id !== myId)
        .map(p => ({ ...p, name: shortenWallet(p.wallet) }));
      hideOvl();
      gamePhase     = 'racing';
      raceStartTime = Date.now();
    }

    else if (msg.type === 'cpu_start') {
      // No opponent found — spawn a CPU kart and do a 3-2-1 countdown locally
      totalPlayers = 2;
      // CPU starts at the bottom of the oval (angle = π/2), going clockwise
      cpuKart = {
        angle:    Math.PI / 2,
        traveled: 0,
        lap:      0,
        finished: false,
        x:        CX,
        y:        CY + CPU_MID_RY,
        facing:   0,
      };
      let c = 3;
      showOvl('VS CPU!',
        `<div id="k-countdown-num">${c}</div>
         <div style="color:#888;font-size:11px;margin-top:10px">No opponent — racing the CPU!</div>`);
      const cdInt = setInterval(() => {
        c--;
        if (c > 0) {
          const el = document.getElementById('k-countdown-num');
          if (el) el.textContent = c;
        } else {
          clearInterval(cdInt);
          hideOvl();
          gamePhase     = 'racing';
          raceStartTime = Date.now();
        }
      }, 1000);
    }

    else if (msg.type === 'others') {
      if (!msg.players) return;
      others = msg.players.map(p => ({
        ...p,
        name: others.find(o => o.id === p.id)?.name || shortenWallet(p.wallet),
      }));
    }

    else if (msg.type === 'player_left') {
      others = others.filter(o => o.id !== msg.playerId);
      totalPlayers = 1 + others.length;
    }

    else if (msg.type === 'winner') {
      const iWon = msg.winnerId === myId;
      const winnerO = others.find(o => o.id === msg.winnerId);
      const winnerName = iWon ? 'YOU' : (winnerO?.name || 'Opponent');
      gamePhase = 'finished';
      showResult(iWon, msg.payout, winnerName);
    }

    else if (msg.type === 'error') {
      showOvl('ERROR', `${msg.error}<br><br>
        <a href="arcade.html" style="color:#a855ff">← Back to Arcade</a>`);
    }
  };

  ws.onclose = () => {
    if (gamePhase !== 'finished' && gamePhase !== 'finishing') {
      showOvl('DISCONNECTED',
        'Connection lost.<br><br>' +
        '<a href="kart.html" style="color:#a855ff">Rejoin</a> &nbsp;|&nbsp; ' +
        '<a href="arcade.html" style="color:#888">← Arcade</a>');
    }
  };
}

function shortenWallet(w) {
  if (!w) return '???';
  return w.slice(0,4) + '…' + w.slice(-3);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp'    || e.key === 'w') { inp.up    = true; e.preventDefault(); }
  if (e.key === 'ArrowDown'  || e.key === 's') { inp.down  = true; e.preventDefault(); }
  if (e.key === 'ArrowLeft'  || e.key === 'a') { inp.left  = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd') { inp.right = true; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'e') { useItem(); e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp'    || e.key === 'w') inp.up    = false;
  if (e.key === 'ArrowDown'  || e.key === 's') inp.down  = false;
  if (e.key === 'ArrowLeft'  || e.key === 'a') inp.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') inp.right = false;
});

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderWalletBar('wbar');
  resizeCanvas();
  loop();

  showPayGate('kart', txId => {
    const wallet = WalletState.address;
    if (!txId || !wallet) {
      showOvl('ERROR',
        'Session lost.<br><a href="arcade.html" style="color:#a855ff">← Arcade</a>');
      return;
    }
    connectWS(wallet, txId);
  }, { pot: 'UP TO 18 MONET', rake: '10%' });
});
