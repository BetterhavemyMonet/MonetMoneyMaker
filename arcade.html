<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade</title>

<style>
body {
  background:#02040a;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

h1 {
  color:#00f0ff;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,255,200,0.3);
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00ff9d;
}
</style>
</head>

<body>

<h1>🎮 MONET ARCADE</h1>

<div class="grid">

<div class="card">
  <p>Click Speed</p>
  <button onclick="location.href='game1.html'">Play</button>
</div>

<div class="card">
  <p>Number Guess</p>
  <button onclick="location.href='game2.html'">Play</button>
</div>

<div class="card">
  <p>Reaction Test</p>
  <button onclick="location.href='game3.html'">Play</button>
</div>

</div>

</body>
</html>
