<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Arcade</title>

<style>
body {
  background:#02040a;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

h1 { color:#00f0ff; }

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:15px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,255,200,0.2);
  cursor:pointer;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00ff9d;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🎮 MONET ARCADE</h1>

<div class="grid">

<div class="card">
  <p>⚡ Reaction Speed</p>
  <button onclick="location.href='reaction.html'">Play</button>
</div>

<div class="card">
  <p>🟢 Tap Frenzy</p>
  <button onclick="location.href='tap.html'">Play</button>
</div>

<div class="card">
  <p>🟣 Dodger</p>
  <button onclick="location.href='dodger.html'">Play</button>
</div>

</div>

</body>
</html>
