<script>
// ─── Touch key state ──────────────────────────────────────────────────────────
const _touchKeys={left:false,right:false,up:false,shift:false};
function setKey(k,v,e){if(e)e.preventDefault();_touchKeys[k]=v;}

// ─── Game globals ─────────────────────────────────────────────────────────────
let phaserGame=null,gameRunning=false,finalScore=0;

// ─── Lobby → start ────────────────────────────────────────────────────────────
showGameLobby('gator',()=>{
  document.getElementById('lobby-wrap').style.display='none';
  startPhaserGame();
});

function startPhaserGame(){
  if(phaserGame){phaserGame.destroy(true);phaserGame=null;}
  gameRunning=true;finalScore=0;
  const arena=document.querySelector('.arena');
  const W=Math.min(arena.clientWidth,520),H=Math.min(arena.clientHeight,480);
  phaserGame=new Phaser.Game({
    type:Phaser.AUTO,width:W,height:H,
    parent:'game-container',backgroundColor:'#0f051c',
    physics:{default:'arcade',arcade:{gravity:{y:1000},debug:false}},
    scene:{preload,create,update}
  });
}

// ─── Level definitions ────────────────────────────────────────────────────────
// plats: {x,y} in 0-1 fractions of canvas, w in 0-1 width fraction
// coins: [[x,y]...] fractions
// spikes: [[x,y,w]...] fractions — hazard zones, penalise +respawn
// enemies: [{x,y,rangeW,speed}] — patrol horizontally, penalise on touch
const LEVELS=[

// ─── Phaser scene state ───────────────────────────────────────────────────────
let player,platforms,coins,spikeGroup,enemyGroup;
let scoreText,timerText,levelText,scene_ref;
let score=0,timeLeft=60,isGliding=false;
let currentLevel=1,levelTransitioning=false;
let clockEvent,bgGfx,starsGfx,enemiesList=[];
let spikeHitCool=false,enemyHitCool=false;

function preload(){
  this.load.image('dino','/dino-sprite.png');
}

function create(){
  scene_ref=this;
  // Inherit state from level transition data if present
  const data=this.scene.settings.data||{};
  currentLevel     = data.level    !==undefined ? data.level    : 1;
  score            = data.score    !==undefined ? data.score    : 0;
  timeLeft         = data.timeLeft !==undefined ? data.timeLeft : 60;
  isGliding=false;levelTransitioning=false;
  enemiesList=[];spikeHitCool=false;enemyHitCool=false;
  finalScore=score;gameRunning=true;

  const W=this.scale.width,H=this.scale.height;
  const SX=W/800,SY=H/600;

  bgGfx  =this.add.graphics();
  starsGfx=this.add.graphics();

  platforms =this.physics.add.staticGroup();
  coins     =this.physics.add.group();
  spikeGroup=this.physics.add.staticGroup();
  enemyGroup=this.physics.add.group();

  // Coin texture (cached once per game)
  const CR=Math.round(9*Math.min(SX,SY));
  if(!this.textures.exists('coin')){
    let cg=this.make.graphics({x:0,y:0,add:false});
    cg.fillStyle(0xf1c40f,1);cg.fillCircle(CR+1,CR+1,CR+1);
    cg.lineStyle(1.5,0xffd700,1);cg.strokeCircle(CR+1,CR+1,CR-1);
    cg.generateTexture('coin',(CR+1)*2,(CR+1)*2);cg.destroy();
  }

  // Player
  const GW=Math.round(36*SX),GH=Math.round(44*SY);
  const lev0=LEVELS[currentLevel-1];
  player=this.physics.add.sprite(W*lev0.spawn[0],H*lev0.spawn[1],'dino');
  player.setDisplaySize(GW,GH);player.setBounce(0.05);
  player.setCollideWorldBounds(true);

  this.physics.add.collider(player,platforms);
  this.physics.add.overlap(player,coins,collectCoin,null,this);
  this.physics.add.overlap(player,spikeGroup,hitSpike,null,this);
  this.physics.add.overlap(player,enemyGroup,hitEnemy,null,this);

  // HUD
  const FS=Math.max(13,Math.round(18*Math.min(SX,SY)));
  const FS2=Math.max(10,Math.round(12*Math.min(SX,SY)));
  scoreText=this.add.text(10,8,'M-COINS: '+score,{
    fontSize:FS+'px',fill:'#00ffcc',fontFamily:'Orbitron,sans-serif',
    fontStyle:'bold',stroke:'#000',strokeThickness:3
  }).setDepth(10);
  timerText=this.add.text(W-10,8,'TIME: '+timeLeft,{
    fontSize:FS+'px',fill:timeLeft<=10?'#ff4444':'#ffd700',
    fontFamily:'Orbitron,sans-serif',fontStyle:'bold',
    stroke:'#000',strokeThickness:3
  }).setDepth(10).setOrigin(1,0);
  levelText=this.add.text(W/2,8,'',{
    fontSize:FS2+'px',fill:'#aaaaaa',fontFamily:'Orbitron,sans-serif',
    fontStyle:'bold',stroke:'#000',strokeThickness:2
  }).setDepth(10).setOrigin(.5,0);

  // Countdown clock
  clockEvent=this.time.addEvent({delay:1000,loop:true,callback:()=>{
    if(!gameRunning||levelTransitioning)return;
    timeLeft--;
    timerText.setText('TIME: '+timeLeft);
    if(timeLeft<=10)timerText.setStyle({fill:'#ff4444'});
    if(timeLeft<=0)endGame();
  }});

  buildLevel(this,currentLevel);
}

// ─── Build / rebuild a level in-place ─────────────────────────────────────────
function buildLevel(scene,lvlNum){
  const lev=LEVELS[Math.min(lvlNum,LEVELS.length)-1];
  const W=scene.scale.width,H=scene.scale.height;
  const SX=W/800,SY=H/600;

  // Background
  bgGfx.clear();
  bgGfx.fillGradientStyle(lev.bgTop,lev.bgTop,lev.bgBot,lev.bgBot,1);
  bgGfx.fillRect(0,0,W,H);

  // Stars
  starsGfx.clear();
  for(let i=0;i<50;i++){
    starsGfx.fillStyle(0xffffff,Phaser.Math.FloatBetween(0.15,0.85));
    starsGfx.fillRect(
      Phaser.Math.Between(0,W),
      Phaser.Math.Between(0,Math.round(H*.80)),1,1);
  }

  // Level label
  levelText.setText('LVL '+lvlNum+': '+lev.name);
  levelText.setStyle({fill:lev.nameColor});

  // Generate platform textures (per level, cached after first use)
  const gKey='pg'+lvlNum,iKey='pi'+lvlNum,sKey='ps'+lvlNum;
  if(!scene.textures.exists(gKey)){
    const tw=Math.round(400*SX);
    let g=scene.make.graphics({x:0,y:0,add:false});
    g.fillStyle(lev.platBody,1);g.fillRect(0,0,tw,28);
    g.fillStyle(lev.platAccent,1);g.fillRect(0,0,tw,4);
    g.generateTexture(gKey,tw,28);g.destroy();
  }
  if(!scene.textures.exists(iKey)){
    const tw=Math.round(140*SX);
    let g=scene.make.graphics({x:0,y:0,add:false});
    g.fillStyle(lev.platBody,1);g.fillRect(0,0,tw,18);
    g.fillStyle(lev.platAccent,1);g.fillRect(0,0,tw,4);
    g.generateTexture(iKey,tw,18);g.destroy();
  }
  if(!scene.textures.exists(sKey)){
    const sw=Math.round(80*SX);
    let g=scene.make.graphics({x:0,y:0,add:false});
    g.fillStyle(0xff2200,1);
    for(let i=0;i<5;i++)g.fillTriangle(i*sw/5,12,i*sw/5+sw/10,0,(i+1)*sw/5,12);
    g.generateTexture(sKey,sw,12);g.destroy();
  }

  // Clear old level objects
  platforms.clear(true,true);
  coins.clear(true,true);
  spikeGroup.clear(true,true);
  enemyGroup.clear(true,true);
  enemiesList=[];

  // Reset player to spawn
  player.setPosition(W*lev.spawn[0],H*lev.spawn[1]);
  player.setVelocity(0,0);

  // Platforms
  lev.plats.forEach(p=>{
    const key=p.ground?gKey:iKey;
    const ph=p.ground?28:18;
    let obj=platforms.create(W*p.x,H*p.y,key);
    obj.setDisplaySize(W*p.w,ph);
    obj.refreshBody();
  });

  // Coins — gravity must be off or they fall off screen immediately
  lev.coins.forEach(([rx,ry])=>{
    let c=coins.create(W*rx,H*ry,'coin');
    c.body.allowGravity=false;
    c.body.immovable=true;
    c._value=lev.coinValue;
  });

  // Spike hazards
  lev.spikes.forEach(([rx,ry,rw])=>{
    let sp=spikeGroup.create(W*rx,H*ry-6,sKey);
    sp.setDisplaySize(W*rw,12);
    sp.refreshBody();
  });

  // Enemies
  const GW=Math.round(36*SX),GH=Math.round(44*SY);
  lev.enemies.forEach(e=>{
    let en=enemyGroup.create(W*e.x,H*e.y,'dino');
    en.setDisplaySize(GW,GH);
    en.setTint(0xff3333);
    en.setImmovable(true);
    en.body.allowGravity=false;
    en.setVelocityX(e.speed);
    en._rangeLeft =W*(e.x-e.rangeW);
    en._rangeRight=W*(e.x+e.rangeW);
    en._speed=e.speed;
    enemiesList.push(en);
  });
}

// ─── Phaser update ────────────────────────────────────────────────────────────
function update(){
  if(!player||!gameRunning||levelTransitioning)return;

  const onGround=player.body.touching.down||player.body.blocked.down;
  const spd=_touchKeys.shift?360:200;

  // Horizontal movement
  if(_touchKeys.left){player.setVelocityX(-spd);player.flipX=true;}
  else if(_touchKeys.right){player.setVelocityX(spd);player.flipX=false;}
  else {
    const kb=phaserGame?.scene?.scenes?.[0]?.input?.keyboard;
    if(kb){
      const L=kb.addKey(37).isDown,R=kb.addKey(39).isDown,SH=kb.addKey(16).isDown;
      const spd2=SH?360:200;
      if(L){player.setVelocityX(-spd2);player.flipX=true;}
      else if(R){player.setVelocityX(spd2);player.flipX=false;}
      else player.setVelocityX(0);
    } else player.setVelocityX(0);
  }

  // Jump / glide
  const upHeld=_touchKeys.up||(phaserGame?.scene?.scenes?.[0]?.input?.keyboard?.addKey(38)?.isDown);
  if(upHeld){
    if(onGround){player.setVelocityY(-460);isGliding=false;}
    else if(player.body.velocity.y>0){
      isGliding=true;
      player.setGravityY(140-1000);
      player.setVelocityY(Math.min(player.body.velocity.y,70));
    }
  } else {isGliding=false;player.setGravityY(0);}

  // Visual tint
  if(_touchKeys.shift&&(_touchKeys.left||_touchKeys.right))player.setTint(0xff3333);
  else if(isGliding)player.setTint(0x33b5ff);
  else player.clearTint();

  // Patrol enemies
  enemiesList.forEach(en=>{
    if(!en.active)return;
    if(en.x<=en._rangeLeft){en.setVelocityX(en._speed);en.flipX=false;}
    else if(en.x>=en._rangeRight){en.setVelocityX(-en._speed);en.flipX=true;}
  });
}

// ─── Coin collect ─────────────────────────────────────────────────────────────
function collectCoin(pl,coin){
  if(!coin.active)return;
  coin.disableBody(true,true);
  const val=coin._value||10;
  score+=val;finalScore=score;
  scoreText.setText('M-COINS: '+score);
  let pop=scene_ref.add.text(coin.x,coin.y-12,'+'+val,{
    fontSize:'14px',fill:'#ffd700',fontFamily:'Orbitron,sans-serif',
    fontStyle:'bold',stroke:'#000',strokeThickness:2
  }).setDepth(20);
  scene_ref.tweens.add({targets:pop,y:pop.y-38,alpha:0,duration:700,
    onComplete:()=>pop.destroy()});
  if(coins.countActive(true)===0)advanceLevel();
}

// ─── Hazard: spikes ───────────────────────────────────────────────────────────
function hitSpike(pl,spike){
  if(spikeHitCool)return;
  spikeHitCool=true;
  const lev=LEVELS[currentLevel-1];
  const W=phaserGame.scale.width,H=phaserGame.scale.height;
  player.setPosition(W*lev.spawn[0],H*lev.spawn[1]);
  player.setVelocity(0,-180);
  score=Math.max(0,score-15);finalScore=score;
  scoreText.setText('M-COINS: '+score);
  player.setTint(0xff0000);
  scene_ref.time.delayedCall(420,()=>player.clearTint());
  scene_ref.time.delayedCall(950,()=>{spikeHitCool=false;});
}

// ─── Hazard: enemies ──────────────────────────────────────────────────────────
function hitEnemy(pl,enemy){
  if(enemyHitCool)return;
  enemyHitCool=true;
  player.setVelocity(player.x<enemy.x?-310:310,-370);
  score=Math.max(0,score-10);finalScore=score;
  scoreText.setText('M-COINS: '+score);
  player.setTint(0xff4444);
  scene_ref.time.delayedCall(360,()=>player.clearTint());
  scene_ref.time.delayedCall(650,()=>{enemyHitCool=false;});
}

// ─── Level advance ────────────────────────────────────────────────────────────
function advanceLevel(){
  if(levelTransitioning)return;
  levelTransitioning=true;

  const W=phaserGame.scale.width,H=phaserGame.scale.height;
  const sc=Math.min(W/800,H/600);
  const isLast=currentLevel>=LEVELS.length;
  const nextLvl=isLast?1:currentLevel+1;   // loop back after final level
  const lev=LEVELS[nextLvl-1];

  // Transition overlay
  const objs=[];
  objs.push(scene_ref.add.rectangle(W/2,H/2,W,H,0x000000,0.82).setDepth(50));

  // Heading
  const heading=isLast?'ALL CLEAR! LOOPING…':'LEVEL '+(nextLvl)+'!';
  objs.push(scene_ref.add.text(W/2,H/2-38,heading,{
    fontSize:Math.round(30*sc)+'px',
    fill:isLast?'#ffd700':lev.nameColor,
    fontFamily:'Orbitron,sans-serif',fontStyle:'bold',
    stroke:'#000',strokeThickness:5
  }).setOrigin(.5).setDepth(51));

  // Level name
  objs.push(scene_ref.add.text(W/2,H/2+2,lev.name,{
    fontSize:Math.round(17*sc)+'px',fill:'#ffffff',
    fontFamily:'Orbitron,sans-serif',fontStyle:'bold',
    stroke:'#000',strokeThickness:3
  }).setOrigin(.5).setDepth(51));

  // Coin info
  objs.push(scene_ref.add.text(W/2,H/2+28,
    lev.coins.length+' COINS  ·  '+lev.coinValue+' pts each',{
    fontSize:Math.round(11*sc)+'px',fill:lev.nameColor,
    fontFamily:'Orbitron,sans-serif',stroke:'#000',strokeThickness:2
  }).setOrigin(.5).setDepth(51));

  // Hazard hint
  const hints=[];
  if(lev.spikes.length) hints.push('⚠ SPIKES');
  if(lev.enemies.length) hints.push('👾 ENEMIES ×'+lev.enemies.length);
  if(hints.length){
    objs.push(scene_ref.add.text(W/2,H/2+46,hints.join('   '),{
      fontSize:Math.round(10*sc)+'px',fill:'#ff6644',
      fontFamily:'Orbitron,sans-serif',stroke:'#000',strokeThickness:2
    }).setOrigin(.5).setDepth(51));
  }

  scene_ref.time.delayedCall(2400,()=>{
    objs.forEach(o=>o.destroy());
    currentLevel=nextLvl;
    levelTransitioning=false;
    spikeHitCool=false;enemyHitCool=false;
    buildLevel(scene_ref,currentLevel);
  });
}

// ─── Game over ────────────────────────────────────────────────────────────────
function endGame(){
  if(!gameRunning)return;
  gameRunning=false;
  if(clockEvent)clockEvent.remove();
  const W=phaserGame.scale.width,H=phaserGame.scale.height;
  const sc=Math.min(W/800,H/600);
  scene_ref.add.rectangle(W/2,H/2,W,H,0x000000,0.78).setDepth(30);
  scene_ref.add.text(W/2,H/2-42,"TIME'S UP!",{
    fontSize:Math.round(28*sc)+'px',fill:'#00ffcc',
    fontFamily:'Orbitron,sans-serif',fontStyle:'bold',
    stroke:'#000',strokeThickness:4
  }).setOrigin(.5).setDepth(31);
  scene_ref.add.text(W/2,H/2+4,'SCORE: '+finalScore,{
    fontSize:Math.round(22*sc)+'px',fill:'#ffd700',
    fontFamily:'Orbitron,sans-serif',fontStyle:'bold',
    stroke:'#000',strokeThickness:3
  }).setOrigin(.5).setDepth(31);
  scene_ref.add.text(W/2,H/2+38,'LEVEL REACHED: '+currentLevel+' / '+LEVELS.length,{
    fontSize:Math.round(13*sc)+'px',fill:'#aaaaaa',
    fontFamily:'Orbitron,sans-serif',stroke:'#000',strokeThickness:2
  }).setOrigin(.5).setDepth(31);
  setTimeout(()=>{
    if(phaserGame){phaserGame.destroy(true);phaserGame=null;}
    arcadeSubmitScore('gator',finalScore);
  },2200);
}
</script>
