<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Challenge — Head to Head</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script src="/wallet.js"></script>
<style>
body { background: #02040a url('/title.jpg') center/cover fixed; min-height:100vh; }
body::before { content:''; position:fixed; inset:0; background:rgba(2,4,10,0.86); pointer-events:none; z-index:0; }
.page { position:relative; z-index:1; padding:12px 0 40px; }
.wallet-bar { text-align:center; padding:8px 16px; background:rgba(0,0,0,0.3); }

.nav-row { display:flex; justify-content:center; gap:10px; margin:12px 0; flex-wrap:wrap; padding:0 12px; }
.nav-btn { padding:7px 18px; border-radius:8px; border:1px solid #a855ff; background:transparent; color:#a855ff; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:bold; cursor:pointer; }
.nav-btn:hover { background:#a855ff; color:#000; }

.section { max-width:480px; margin:0 auto; padding:0 14px; }

.card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; padding:20px; margin-bottom:16px;
}
.card-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:800; color:#fff; margin-bottom:8px; }

.input-row { display:flex; gap:8px; margin-bottom:12px; }
input[type=text], select {
  flex:1; padding:10px 12px; border-radius:10px; border:1px solid #333;
  background:#111827; color:#fff; font-family:'Orbitron',sans-serif; font-size:11px;
}
input:focus, select:focus { outline:none; border-color:#a855ff; }
.btn-primary {
  padding:10px 18px; border-radius:10px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#a855ff,#7c3aed); color:#fff;
  font-family:'Orbitron',sans-serif; font-size:11px; font-weight:800;
  white-space:nowrap;
}
.btn-green {
  padding:10px 18px; border-radius:10px; border:none; cursor:pointer;
  background:linear-gradient(135deg,#00ff9d,#00c97b); color:#000;
  font-family:'Orbitron',sans-serif; font-size:11px; font-weight:800;
  white-space:nowrap;
}
.btn-full { width:100%; padding:12px; margin-top:4px; font-size:13px; }
.err { color:#ff4488; font-size:11px; margin-top:4px; min-height:16px; }
.ok  { color:#00ff9d; font-size:11px; margin-top:4px; }

.challenge-card {
  background:rgba(0,240,255,0.05); border:1px solid #00f0ff33;
  border-radius:12px; padding:14px; margin-bottom:10px;
}
.ch-code   { font-family:'Orbitron',sans-serif; font-size:20px; font-weight:800; color:#00f0ff; letter-spacing:4px; }
.ch-game   { font-size:11px; color:#888; margin:4px 0; }
.ch-pot    { font-size:13px; font-weight:700; color:#ffd700; }
.ch-status { font-size:10px; padding:2px 8px; border-radius:20px; display:inline-block; margin-top:4px; }
.st-open   { background:rgba(0,255,157,0.1); color:#00ff9d; border:1px solid #00ff9d44; }
.st-active { background:rgba(168,85,255,0.1); color:#a855ff; border:1px solid #a855ff44; }
.st-complete { background:rgba(255,215,0,0.1); color:#ffd700; border:1px solid #ffd70044; }
.st-expired  { background:rgba(136,136,136,0.1); color:#888; border:1px solid #88888844; }
.ch-share  { display:flex; align-items:center; gap:6px; margin-top:8px; }
.ch-link   { flex:1; padding:6px 8px; background:#111; border:1px solid #333; border-radius:6px; font-size:9px; color:#666; word-break:break-all; }
.btn-copy  { padding:6px 10px; font-size:9px; border:1px solid #333; background:#1e2126; color:#aaa; border-radius:6px; cursor:pointer; white-space:nowrap; }
.btn-copy:hover { border-color:#00f0ff; color:#00f0ff; }

.game-opts { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
.game-opt  {
  padding:5px 12px; border-radius:8px; border:1px solid #333;
  background:#111; color:#888; cursor:pointer;
  font-family:'Orbitron',sans-serif; font-size:9px; font-weight:bold;
}
.game-opt.active { border-color:#a855ff; background:#a855ff22; color:#a855ff; }

.prize-box { background:rgba(255,215,0,0.07); border:1px solid #ffd70033; border-radius:10px; padding:12px; margin-bottom:12px; text-align:center; }
.prize-box .big { font-size:22px; font-weight:800; color:#ffd700; }
.prize-box .sub { font-size:10px; color:#888; }
</style>
</head>
<body>
<div class="wallet-bar" id="wbar"></div>
<div class="page">
<img src="/logo.png" style="width:60px;display:block;margin:8px auto 4px;filter:drop-shadow(0 0 12px #00f0ff)">
<h1 style="background:linear-gradient(90deg,#00f0ff,#a855ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0;font-size:20px">HEAD-TO-HEAD</h1>
<p style="color:#888;font-size:11px;margin:4px 0 12px;font-family:Orbitron,sans-serif">Challenge a friend · Pay entry fee · Higher score wins the pot</p>

<div class="nav-row">
  <button class="nav-btn" onclick="location.href='arcade.html'">&#8592; Arcade</button>
  <button class="nav-btn" onclick="location.href='tournament.html'">&#127942; Tournaments</button>
</div>

<div class="section">

  <!-- Create Challenge -->
  <div class="card">
    <div class="card-title">&#9876; CREATE A CHALLENGE</div>
    <div class="prize-box">
      <div class="big" id="c-pot-display">9 MONET</div>
      <div class="sub">Prize pot (90% of 2× entry fee)</div>
    </div>
    <div style="font-size:11px;color:#888;margin-bottom:8px">Pick your game:</div>
    <div class="game-opts" id="game-opts">
      <div class="game-opt active" data-game="frogger" onclick="selectGame(this)">&#128056; Frogger</div>
      <div class="game-opt" data-game="snake" onclick="selectGame(this)">&#128013; Snake</div>
      <div class="game-opt" data-game="pacman" onclick="selectGame(this)">&#128049; Pac-Man</div>
      <div class="game-opt" data-game="pong" onclick="selectGame(this)">&#127934; Pong</div>
      <div class="game-opt" data-game="dino" onclick="selectGame(this)">&#9889; Runner</div>
    </div>
    <button class="btn-primary btn-full" onclick="createNewChallenge()">PAY 5 MONET &amp; CREATE CHALLENGE</button>
    <div class="err" id="c-err"></div>
  </div>

  <!-- Join Challenge -->
  <div class="card">
    <div class="card-title">&#128273; JOIN A CHALLENGE</div>
    <div class="input-row">
      <input type="text" id="join-code" placeholder="ENTER CODE (e.g. A3X7P2)" maxlength="6" style="text-transform:uppercase;letter-spacing:2px;font-size:14px">
      <button class="btn-green" onclick="lookupChallenge()">LOOK UP</button>
    </div>
    <div id="join-preview"></div>
    <div class="err" id="j-err"></div>
  </div>

  <!-- My Challenges -->
  <div class="card">
    <div class="card-title">&#128203; MY CHALLENGES</div>
    <div id="my-challenges"><div style="color:#555;font-size:11px">Connect wallet to see your challenges</div></div>
  </div>

</div>
</div>

<script>
let selectedGame = 'frogger';

function selectGame(el) {
  document.querySelectorAll('.game-opt').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  selectedGame = el.dataset.game;
}

async function createNewChallenge() {
  const btn = document.querySelector('.btn-primary.btn-full');
  const err = document.getElementById('c-err');
  err.textContent = '';
  if (!WalletState.connected) { err.textContent = 'Connect wallet first'; return; }
  btn.textContent = 'Processing...'; btn.disabled = true;
  try {
    const res = await createChallenge(selectedGame);
    btn.textContent = 'PAY 5 MONET & CREATE CHALLENGE'; btn.disabled = false;
    showCreatedChallenge(res);
  } catch(e) {
    btn.textContent = 'PAY 5 MONET & CREATE CHALLENGE'; btn.disabled = false;
    err.textContent = e.message;
  }
}

function showCreatedChallenge(res) {
  const gameUrl = `${res.code.toLowerCase() === 'frogger' ? 'frogger' : selectedGame}.html?challenge=${res.code}`;
  const shareUrl = `${location.origin}/${gameUrl}`;
  const opts = document.getElementById('game-opts');
  opts.parentElement.insertAdjacentHTML('afterbegin', `
    <div style="background:rgba(0,255,157,0.07);border:1px solid #00ff9d33;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center">
      <div style="font-size:11px;color:#888;margin-bottom:4px">CHALLENGE CREATED</div>
      <div class="ch-code" style="font-size:28px;margin:8px 0">${res.code}</div>
      <div style="font-size:11px;color:#00ff9d">Prize pot: ${res.pot} MONET · Share this code!</div>
      <div class="ch-share" style="margin-top:10px">
        <div class="ch-link" id="share-link">${shareUrl}</div>
        <button class="btn-copy" onclick="copyLink('${shareUrl}')">Copy Link</button>
      </div>
      <button class="btn-green btn-full" style="margin-top:10px" onclick="location.href='/${selectedGame}.html?challenge=${res.code}'">PLAY MY TURN &#9658;</button>
    </div>
  `);
  loadMyChallenges();
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.btn-copy');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy Link', 2000); }
  });
}

async function lookupChallenge() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const err  = document.getElementById('j-err');
  const pre  = document.getElementById('join-preview');
  err.textContent = ''; pre.innerHTML = '';
  if (!code || code.length < 4) { err.textContent = 'Enter a valid challenge code'; return; }
  try {
    const res = await api(`/api/challenge/${code}`);
    const c   = res.challenge;
    const pot = c.pot || 9;
    const gameLabel = { frogger:'Frogger', snake:'Snake', pacman:'Pac-Man', pong:'Pong', dino:'Runner' }[c.game] || c.game;
    const timeLeft = Math.max(0, Math.floor((c.expiresAt - Date.now()) / 3600000));
    pre.innerHTML = `
      <div class="challenge-card">
        <div class="ch-code">${c.code}</div>
        <div class="ch-game">&#127918; ${gameLabel} &nbsp;|&nbsp; Expires in ${timeLeft}h</div>
        <div class="ch-pot">&#9733; Prize Pot: ${pot} MONET</div>
        <div><span class="ch-status st-${c.status}">${c.status.toUpperCase()}</span></div>
        ${c.player1?.score !== null ? `<div style="font-size:10px;color:#888;margin-top:6px">P1 score: ${c.player1.score}</div>` : ''}
        ${c.status === 'open' ? `
          <button class="btn-primary btn-full" style="margin-top:10px" onclick="joinAndPlay('${c.code}', '${c.game}')">PAY 5 MONET &amp; ACCEPT CHALLENGE</button>
        ` : c.status === 'active' ? `
          <button class="btn-green btn-full" style="margin-top:10px" onclick="location.href='/${c.game}.html?challenge=${c.code}'">PLAY YOUR TURN &#9658;</button>
        ` : c.status === 'complete' ? `
          <div style="margin-top:8px;font-size:12px;color:#ffd700">&#127942; Winner: ${c.winner ? c.winner.slice(0,6)+'...'+c.winner.slice(-4) : 'TBD'}</div>
          ${c.payoutTxId ? `<div style="font-size:9px;color:#00ff9d;margin-top:4px">Payout sent ✓</div>` : `<div style="font-size:9px;color:#ff4488;margin-top:4px">Payout pending</div>`}
        ` : ''}
        <div class="err" id="jp-err"></div>
      </div>
    `;
  } catch(e) {
    err.textContent = e.message;
  }
}

async function joinAndPlay(code, game) {
  const err = document.getElementById('jp-err');
  if (!WalletState.connected) { err.textContent = 'Connect wallet first'; return; }
  location.href = `/${game}.html?challenge=${code}`;
}

async function loadMyChallenges() {
  const el = document.getElementById('my-challenges');
  if (!WalletState.connected) { el.innerHTML = '<div style="color:#555;font-size:11px">Connect wallet to see your challenges</div>'; return; }
  try {
    const res = await api(`/api/challenges?wallet=${WalletState.address}`);
    const list = res.challenges;
    if (!list.length) { el.innerHTML = '<div style="color:#555;font-size:11px">No challenges yet. Create one above!</div>'; return; }
    el.innerHTML = list.slice().reverse().map(c => {
      const isP1 = c.player1?.wallet === WalletState.address;
      const me   = isP1 ? c.player1 : c.player2;
      const opp  = isP1 ? c.player2 : c.player1;
      const wonIt = c.winner === WalletState.address;
      const gameLabel = { frogger:'Frogger', snake:'Snake', pacman:'Pac-Man', pong:'Pong', dino:'Runner' }[c.game] || c.game;
      return `
        <div class="challenge-card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div class="ch-code" style="font-size:18px">${c.code}</div>
              <div class="ch-game">&#127918; ${gameLabel} &nbsp;|&nbsp; Pot: <span class="ch-pot" style="font-size:11px">${c.pot} MONET</span></div>
            </div>
            <span class="ch-status st-${c.status}">${c.status.toUpperCase()}</span>
          </div>
          <div style="margin-top:8px;font-size:10px;color:#888">
            You: <span style="color:${me?.score !== null ? '#00ff9d' : '#555'}">${me?.score !== null ? me.score + ' pts' : 'Not played'}</span>
            &nbsp;|&nbsp;
            Opponent: <span style="color:${opp?.score !== null ? '#ff4488' : '#555'}">${opp?.score !== null ? opp.score + ' pts' : 'Waiting...'}</span>
          </div>
          ${c.status === 'complete' ? `<div style="font-size:11px;margin-top:6px;color:${wonIt ? '#ffd700' : '#ff4488'}">${wonIt ? '&#127942; YOU WON +'+c.pot+' MONET!' : '&#9747; You lost'}</div>` : ''}
          ${(c.status === 'open' || c.status === 'active') && me?.score === null ? `
            <button class="btn-green btn-full" style="margin-top:8px" onclick="location.href='/${c.game}.html?challenge=${c.code}'">PLAY &#9658;</button>
          ` : ''}
          ${c.status === 'open' && !opp ? `
            <div class="ch-share" style="margin-top:6px">
              <div class="ch-link">${location.origin}/${c.game}.html?challenge=${c.code}</div>
              <button class="btn-copy" onclick="copyLink('${location.origin}/${c.game}.html?challenge=${c.code}')">Copy</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div style="color:#ff4488;font-size:11px">${e.message}</div>`;
  }
}

document.addEventListener('walletConnected', loadMyChallenges);
document.addEventListener('DOMContentLoaded', () => {
  renderWalletBar('wbar');
  loadMyChallenges();
  const urlCode = new URLSearchParams(location.search).get('code');
  if (urlCode) { document.getElementById('join-code').value = urlCode; lookupChallenge(); }
});
</script>
</body>
</html>
