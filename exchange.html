<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Exchange</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
body {
  background-image: url('/title.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  min-height:100vh;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:rgba(2,4,10,0.86);
  pointer-events:none;
  z-index:0;
}
.page { position:relative; z-index:1; padding-bottom:30px; }
.wallet-bar { max-width:600px; margin:0 auto 12px; padding:10px 16px; background:rgba(0,0,0,0.4); border-radius:10px; border:1px solid #333; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; }
.nav-row { display:flex; justify-content:center; gap:10px; margin:8px 0 16px; flex-wrap:wrap; }
.nav-btn { padding:7px 18px; border-radius:8px; border:2px solid #a855ff; background:transparent; color:#a855ff; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-block; }
.nav-btn:hover { background:#a855ff; color:#000; }
.monet-info { max-width:560px; margin:0 auto 16px; background:rgba(168,85,255,0.1); border:1px solid #a855ff33; border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.monet-info .label { font-family:'Orbitron',sans-serif; font-size:11px; color:#a855ff; }
.monet-info .value { font-size:20px; font-weight:bold; color:#fff; }
#jupiter-terminal-wrap {
  max-width:500px; margin:0 auto;
  background:rgba(0,0,0,0.5);
  border-radius:16px; border:1px solid #a855ff44;
  overflow:hidden; min-height:480px;
  position:relative;
}
#jupLoad {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:40px 20px; min-height:300px;
}
.jup-spinner {
  width:40px; height:40px; border:3px solid #a855ff33;
  border-top-color:#a855ff; border-radius:50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.jup-status { color:#888; font-size:13px; font-family:'Orbitron',sans-serif; text-align:center; }
.jup-fallback-btn {
  display:none; margin-top:8px;
  padding:12px 24px; border-radius:10px;
  background:linear-gradient(135deg,#a855ff,#7c3aed);
  color:#fff; font-family:'Orbitron',sans-serif; font-size:12px; font-weight:800;
  border:none; cursor:pointer; text-decoration:none;
  box-shadow:0 0 20px #a855ff44;
}
.jup-fallback-btn:hover { filter:brightness(1.2); }
.swap-hint {
  max-width:500px; margin:0 auto 10px;
  font-size:11px; color:#a78bfa;
  text-align:center; font-family:'Orbitron',sans-serif;
  letter-spacing:.5px;
}
.rpc-badge { text-align:center; font-size:10px; color:#555; padding:6px; font-family:monospace; }
</style>
</head>
<body>
<div class="page">
  <h2>MONET EXCHANGE</h2>
  <div class="wallet-bar" id="walletBar"></div>

  <div class="monet-info">
    <div>
      <div class="label">YOUR MONET BALANCE</div>
      <div class="value" id="monetBal">—</div>
    </div>
    <div style="text-align:right">
      <div class="label">TOKEN ADDRESS</div>
      <div style="font-size:10px;color:#888;font-family:monospace;max-width:200px;word-break:break-all">6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b</div>
    </div>
  </div>

  <div class="nav-row">
    <a class="nav-btn" href="arcade.html">&#127918; Arcade</a>
    <a class="nav-btn" href="portfolio.html">&#128188; Portfolio</a>
    <a class="nav-btn" href="index.html">&#8592; Home</a>
  </div>

  <p class="swap-hint">Swap SOL &#8646; MONET or any Solana token</p>

  <div id="jupiter-terminal-wrap">
    <div id="jupLoad">
      <div class="jup-spinner"></div>
      <div class="jup-status" id="jupStatus">Loading swap widget…</div>
      <a id="jupFallback" class="jup-fallback-btn"
         href="https://jup.ag/swap/SOL-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b"
         target="_blank" rel="noopener">
        &#9654; Open Jupiter Swap
      </a>
    </div>
    <div id="integrated-terminal"></div>
  </div>
  <p class="rpc-badge" id="rpcBadge"></p>
</div>

<script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script src="/wallet.js"></script>
<script>
renderWalletBar('walletBar');

const MONET_MINT = '6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b';
const SOL_MINT   = 'So11111111111111111111111111111111111111112';

// Best free RPCs — no key required, no pre-testing (just try in order)
const RPCS = [
  'https://api.mainnet-beta.solana.com',
  'https://solana-rpc.publicnode.com',
];

document.addEventListener('balanceUpdated', () => {
  const el = document.getElementById('monetBal');
  if (el) el.textContent = WalletState.monetBalance.toFixed(2) + ' MONET';
});
document.addEventListener('walletConnected', () => {
  const el = document.getElementById('monetBal');
  if (el) el.textContent = WalletState.monetBalance.toFixed(2) + ' MONET';
});

let _jupInited = false;

function _showFallback(msg) {
  const status = document.getElementById('jupStatus');
  const btn    = document.getElementById('jupFallback');
  const spin   = document.querySelector('.jup-spinner');
  if (spin)   spin.style.display = 'none';
  if (status) status.textContent = msg || 'Widget unavailable — swap directly on Jupiter:';
  if (btn)    btn.style.display  = 'inline-block';
}

function _jupInit(passThroughWallet) {
  if (_jupInited) return;
  if (!window.Jupiter) return;

  const endpoint = RPCS[0]; // use primary, no blocking pre-test
  const config = {
    displayMode: 'integrated',
    integratedTargetId: 'integrated-terminal',
    endpoint,
    defaultExplorer: 'SolanaFM',
    strictTokenList: false,
    formProps: {
      initialInputMint:  SOL_MINT,
      initialOutputMint: MONET_MINT,
      swapMode: 'ExactIn',
    },
  };
  if (passThroughWallet) config.passThroughWallet = passThroughWallet;

  try {
    window.Jupiter.init(config);
    _jupInited = true;
    document.getElementById('jupLoad').style.display = 'none';
    document.getElementById('rpcBadge').textContent  = 'via ' + new URL(endpoint).hostname;
  } catch(e) {
    console.error('[Exchange] Jupiter.init failed:', e);
    _showFallback('Widget error — swap directly on Jupiter:');
  }
}

// Load Jupiter Terminal v3 dynamically, fall back to v2
function _loadJup(versions, i) {
  if (i >= versions.length) { _showFallback('Could not load swap widget:'); return; }
  const s = document.createElement('script');
  s.src = 'https://terminal.jup.ag/main-' + versions[i] + '.js';
  s.setAttribute('data-preload', '');
  s.onload = () => {
    // Give Jupiter 300 ms to fully initialise its React tree
    setTimeout(() => _jupInit(null), 300);
  };
  s.onerror = () => {
    console.warn('[Exchange] Failed to load Jupiter', versions[i]);
    _loadJup(versions, i + 1);
  };
  document.body.appendChild(s);
}

_loadJup(['v3', 'v2'], 0);

// Show the fallback "Open Jupiter" button after 8 s if still not loaded
setTimeout(() => {
  if (!_jupInited) _showFallback('Taking too long — swap directly on Jupiter:');
}, 8000);

// Re-init when wallet connects
document.addEventListener('walletConnected', () => {
  if (!window.Jupiter) return;
  if (_jupInited) {
    // Jupiter is already running — just resume with connected wallet
    try { window.Jupiter.resume(); } catch(_) {}
    return;
  }
  _jupInit(window.solana);
});
</script>
</body>
</html>
