<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Orbitron',sans-serif;
  background: radial-gradient(circle at top,#0b0f1a,#02040a);
  color:white;
  text-align:center;
}

.hero img {
  width:90%;
  max-width:420px;
  margin:20px auto;
  display:block;
  border-radius:16px;
  box-shadow:0 0 25px rgba(0,255,200,0.3);
}

h1 {
  color:#5df2ff;
}

.btn {
  display:block;
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  border:none;
  cursor:pointer;
}

.connect {
  background:#00ff9d;
  color:black;
}

.exchange {
  background:transparent;
  border:2px solid #d14bff;
  color:#d14bff;
}
</style>
</head>

<body>

<h1>MONET MONEY ARCADE</h1>

<div class="hero">
  <img src="/monetmario.jpg">
</div>

<button class="btn connect" onclick="connectWallet()">CONNECT TO PLAY</button>
<button class="btn exchange" onclick="goToExchange()">EXCHANGE</button>

<div style="margin-top:30px;">
  <h2 style="color:#5df2ff;">Swap SOL → MONET</h2>
  <button onclick="goToExchange()" class="btn connect">Launch Exchange</button>
</div>

<script src="/script.js"></script>

</body>
</html>
