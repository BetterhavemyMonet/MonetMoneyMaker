<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background: radial-gradient(circle at top,#0b0f1a,#02040a);
  color:white;
  font-family:'Orbitron',sans-serif;
  text-align:center;
}

/* 🔥 TITLE STYLE */
.title {
  font-size:28px;
  margin-top:20px;
  background: linear-gradient(90deg,#00f0ff,#a855ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 10px rgba(0,255,255,0.6);
  letter-spacing:2px;
}

/* 🎮 IMAGE */
img {
  width:90%;
  max-width:420px;
  margin:30px auto;
  display:block;
  border-radius:16px;
  box-shadow:0 0 25px rgba(0,255,200,0.25);
}

/* 🔘 BUTTONS */
button {
  display:block;
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
  border:none;
}

.connect {
  background:#00ff9d;
  color:black;
}

.exchange {
  background:transparent;
  border:2px solid #d14bff;
  color:#d14bff;
}
</style>
</head>

<body>

<h1 class="title">MONET MONEY ARCADE</h1>

<img src="/monetmario.jpg">

<button class="connect" onclick="connectWallet()">CONNECT TO PLAY</button>
<button class="exchange" onclick="goToExchange()">EXCHANGE</button>

<script>
function connectWallet() {
  if (!window.solana) {
    alert("Phantom wallet not found");
    return;
  }

  window.solana.connect()
    .then(res => alert("Connected: " + res.publicKey.toString()))
    .catch(() => alert("Connection failed"));
}

function goToExchange() {
  window.open(
    "https://jup.ag/swap/So11111111111111111111111111111111111111112-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b",
    "_blank"
  );
}
</script>

</body>
</html>
