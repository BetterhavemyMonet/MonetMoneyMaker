<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background: radial-gradient(circle at top,#0b0f1a,#02040a);
  font-family:'Orbitron',sans-serif;
  color:white;
  text-align:center;
}

/* 🔮 GLOW TITLE */
.title {
  font-size:30px;
  margin-top:20px;
  background: linear-gradient(90deg,#00f0ff,#a855ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:
    0 0 10px rgba(0,255,255,0.7),
    0 0 20px rgba(168,85,255,0.6);
  letter-spacing:2px;
}

/* 🎮 HERO IMAGE */
.hero img {
  width:90%;
  max-width:420px;
  margin:25px auto;
  display:block;
  border-radius:18px;
  box-shadow:
    0 0 25px rgba(0,255,200,0.3),
    0 0 50px rgba(168,85,255,0.2);
}

/* 🔘 BUTTONS */
.btn {
  display:block;
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:12px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  font-size:15px;
}

/* CONNECT BUTTON */
.connect {
  background:linear-gradient(135deg,#00ff9d,#00ffc3);
  color:black;
  box-shadow:0 0 15px rgba(0,255,150,0.5);
}

/* EXCHANGE BUTTON */
.exchange {
  background:transparent;
  border:2px solid #a855ff;
  color:#a855ff;
  box-shadow:0 0 10px rgba(168,85,255,0.4);
}

/* SECTION BOX */
.section {
  margin-top:30px;
}

.subtitle {
  color:#00f0ff;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h1 class="title">MONET MONEY ARCADE</h1>

<div class="hero">
  <img src="/monetmario.jpg">
</div>

<button class="btn connect" onclick="connectWallet()">CONNECT TO PLAY</button>
<button class="btn exchange" onclick="goToExchange()">EXCHANGE</button>

<div class="section">
  <h2 class="subtitle">Swap SOL → MONET</h2>
  <button class="btn connect" onclick="goToExchange()">Launch Exchange</button>
</div>

<script>
function connectWallet() {
  if (!window.solana) {
    alert("Phantom wallet not found");
    return;
  }

  window.solana.connect()
    .then(res => alert("Connected: " + res.publicKey.toString()))
    .catch(() => alert("Connection failed"));
}

function goToExchange() {
  window.open(
    "https://jup.ag/swap/So11111111111111111111111111111111111111112-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b",
    "_blank"
  );
}
</script>

</body>
</html>
