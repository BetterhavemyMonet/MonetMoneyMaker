<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<style>
body {
  background:#02040a;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

h1 { color:#00f0ff; }

img {
  width:90%;
  max-width:420px;
  margin:20px auto;
  display:block;
}

button {
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:10px;
  border:none;
  font-weight:bold;
}

.connect { background:#00ff9d; color:black; }
.exchange { border:2px solid #a855ff; background:none; color:#a855ff; }

.wallet {
  margin-top:10px;
  font-size:14px;
  color:#00ff9d;
}

.balance {
  font-size:16px;
  margin-bottom:10px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800</head>display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>

<body>

<h1>MONET MONEY ARCADE</h1>

<div class="wallet" id="wallet">Not connected</div>
<div class="balance">Balance: <span id="bal">0</span> MONET</div>

<img src="/monetmario.jpg">

<button class="connect" onclick="connectAndPlay()">CONNECT TO PLAY</button>
<button class="exchange" onclick="goExchange()">EXCHANGE</button>

<script>
async function connectAndPlay() {
  if (!window.solana) {
    alert("Install Phantom Wallet");
    return;
  }

  try {
    const resp = await window.solana.connect();
    const addr = resp.publicKey.toString();

    document.getElementById("wallet").innerText = addr;

    // fake stored balance for now
    let bal = localStorage.getItem("monet_balance") || 0;
    document.getElementById("bal").innerText = bal;

    window.location.href = "arcade.html";

  } catch {
    alert("Connection failed");
  }
}

function goExchange() {
  window.open(
    "https://jup.ag/swap/So11111111111111111111111111111111111111112-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b",
    "_blank"
  );
}
</script>

</body>
</html>
