<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<style>
body {
  background:#02040a;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

h1 { color:#00f0ff; }

img {
  width:90%;
  max-width:420px;
  margin:20px auto;
  display:block;
  border-radius:16px;
}

button {
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:10px;
  border:none;
  font-weight:bold;
}

.connect { background:#00ff9d; color:black; }
.exchange { border:2px solid #a855ff; background:none; color:#a855ff; }
</style>
</head>

<body>

<h1>MONET MONEY ARCADE</h1>

<img src="/monetmario.jpg">

<button class="connect" onclick="connectAndPlay()">CONNECT TO PLAY</button>
<button class="exchange" onclick="goExchange()">EXCHANGE</button>

<script>
async function connectAndPlay() {
  if (!window.solana) {
    alert("Install Phantom Wallet");
    return;
  }

  try {
    const resp = await window.solana.connect();
    console.log("Connected:", resp.publicKey.toString());

    // after connect → go to arcade
    window.location.href = "arcade.html";

  } catch (err) {
    alert("Connection failed");
  }
}

function goExchange() {
  window.open(
    "https://jup.ag/swap/So11111111111111111111111111111111111111112-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b",
    "_blank"
  );
}
</script>

</body>
</html>
