<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Orbitron',sans-serif;
  background: radial-gradient(circle at top,#0b0f1a,#02040a);
  color:white;
  text-align:center;
}

.logo {
  margin-top:40px;
}

.logo img {
  width:120px;
}

h1 {
  font-size:32px;
  color:#5df2ff;
  margin:20px 0 10px;
}

.subtitle {
  opacity:0.7;
  margin-bottom:30px;
}

.btn {
  display:block;
  width:80%;
  max-width:300px;
  margin:12px auto;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  font-size:16px;
}

.connect {
  background:#00ff9d;
  color:black;
}

.exchange {
  background:transparent;
  border:2px solid #d14bff;
  color:#d14bff;
}

.card {
  margin:20px;
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,0.03);
  box-shadow:0 0 20px rgba(0,255,150,0.2);
}

.stat {
  font-size:28px;
  color:#00ffcc;
}

</style>
</head>

<body>

<div class="logo">
  <img src="/monetmario.jpg" alt="Monet Arcade" style="width:90%; max-width:420px;">
</div>

<h1>MONET MONEY ARCADE</h1>
<p class="subtitle">Play • Compete • Win the Pot</p>

<button class="btn connect" onclick="connectWallet()">CONNECT TO PLAY</button>
<button class="btn exchange">EXCHANGE</button>

<div class="card">
  <p>Total Players</p>
  <div class="stat">5</div>
  <p>Games Played</p>
  <div class="stat">0</div>
  <p>MONET Rewarded</p>
  <div class="stat">0</div>
</div>

<div class="card">
  <h2>THE ARCADE</h2>
  <p>Play games. Earn MONET. Climb leaderboards.</p>
</div>

<script type="module">
async function connectWallet() {
  try {
    const resp = await window.solana.connect();
    alert("Connected: " + resp.publicKey.toString());
  } catch {
    alert("Wallet failed");
  }
}
window.connectWallet = connectWallet;
</script>

</body>
</html>
