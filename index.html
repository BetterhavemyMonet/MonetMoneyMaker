<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monet Money Arcade</title>

<style>
body {
  margin:0;
  background:#02040a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

img {
  width:90%;
  max-width:420px;
  margin:30px auto;
  display:block;
}

button {
  display:block;
  width:80%;
  max-width:300px;
  margin:10px auto;
  padding:14px;
  border-radius:10px;
  border:none;
  font-weight:bold;
}

.connect { background:#00ff9d; color:black; }
.exchange { border:2px solid #d14bff; background:none; color:#d14bff; }
</style>
</head>

<body>

<h1>MONET MONEY ARCADE</h1>

<img src="/monetmario.jpg">

<button class="connect" onclick="connectWallet()">CONNECT TO PLAY</button>
<button class="exchange" onclick="goToExchange()">EXCHANGE</button>

<script>
function connectWallet() {
  if (!window.solana) {
    alert("Phantom wallet not found");
    return;
  }

  window.solana.connect()
    .then(res => alert("Connected: " + res.publicKey.toString()))
    .catch(() => alert("Connection failed"));
}

function goToExchange() {
  window.open(
    "https://jup.ag/swap/So11111111111111111111111111111111111111112-6eACLGXCGdw9D5zb5eBKyFnFNTX9pTihDEpZQ7gYAX1b",
    "_blank"
  );
}
</script>

</body>
</html>
